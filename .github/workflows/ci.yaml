name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint -d relaxed .

  compile:
    name: ESPHome Compile (alarm + thermostat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .esphome
          key: pio-${{ hashFiles('esp32-hass-panel.yaml', 'packages/*.yaml') }}
          restore-keys: pio-

      - name: Install ESPHome
        run: pip install esphome

      - name: Copy test secrets
        run: cp tests/secrets.yaml secrets.yaml

      - name: Disable API encryption for CI
        # No valid keys in test fixtures — strip the encryption block
        run: sed -i '/^  encryption:/,/^    key:/d' esp32-hass-panel.yaml

      - name: Compile firmware (ESP32-S3 / esp-idf)
        run: esphome compile esp32-hass-panel.yaml
