name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint -d relaxed .

  compile:
    name: ESPHome Compile (alarm + thermostat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .esphome
          key: pio-${{ hashFiles('esp32-hass-panel.yaml', 'packages/*.yaml') }}
          restore-keys: pio-

      - name: Install ESPHome
        run: pip install esphome

      - name: Copy test secrets
        run: cp tests/secrets.yaml secrets.yaml

      - name: Disable API encryption for CI
        # No valid keys in test fixtures — strip the encryption block. The
        # api: block now lives in packages/core.yaml (included by the full
        # bundle and every slim fixture), so strip it there once.
        run: sed -i '/^  encryption:/,/^    key:/d' packages/core.yaml

      # All compile steps use tests/compile.py, which mutes ESPHome's
      # unsuppressable GPIO19/GPIO20 USB-Serial-JTAG warning (board-fixed
      # pins: GPIO19 = touchscreen I2C SDA, GPIO20 = display green data
      # line — no per-pin opt-out in ESPHome's schema). Every other
      # warning still surfaces, and the grep guard fails the build on
      # any of them.

      - name: Compile firmware (ESP32-S3 / esp-idf)
        shell: bash
        run: |
          set -o pipefail
          python tests/compile.py compile esp32-hass-panel.yaml 2>&1 \
              | tee main-build.log
          if grep -E '^WARNING ' main-build.log; then
              echo "::error::Unexpected warning(s) in main build (above)"
              exit 1
          fi

      - name: Compile everything fixture (all pages, all entities)
        # Maximal build — wraps the full bundle with every entity configured,
        # all four nav slots filled, and non-default sleep-mode substitutions.
        shell: bash
        run: |
          set -o pipefail
          python tests/compile.py compile tests/full-panel.yaml 2>&1 \
              | tee full-build.log
          if grep -E '^WARNING ' full-build.log; then
              echo "::error::Unexpected warning(s) in full-panel build (above)"
              exit 1
          fi

      - name: Compile bedroom alarm panel (one-page sleep test)
        # Slim alarm-only (nav_page_count: 1) bedroom config with sleep
        # mode enabled by default and minimal substitutions (board /
        # alarm defaults come from the packages).
        shell: bash
        run: |
          set -o pipefail
          python tests/compile.py compile tests/bedroom-alarm-panel.yaml 2>&1 \
              | tee bedroom-build.log
          if grep -E '^WARNING ' bedroom-build.log; then
              echo "::error::Unexpected warning(s) in bedroom-alarm-panel build (above)"
              exit 1
          fi

      - name: Compile area panel (group dashboard routing test)
        # Slim single-page (nav_page_count: 1) config that registers
        # area_page in nav slot 1, exercising the strcmp area_page routing
        # in packages/area-ui.yaml. Board / area entity defaults come from
        # the packages.
        #
        # IMPORTANT: this is a full *compile*, not `esphome config`. The
        # fixture configures every kind (lights/switches/covers/locks/temp/
        # humidity) so each on_value lambda is code-generated and type-
        # checked by the C++ compiler. `esphome config` only validates the
        # schema and will NOT catch lambda errors (e.g. a text: lambda
        # returning const char* instead of std::string, or a text_color:
        # lambda returning int instead of lv_color_t) — only this step does.
        shell: bash
        run: |
          set -o pipefail
          python tests/compile.py compile tests/area-panel.yaml 2>&1 \
              | tee area-build.log
          if grep -E '^WARNING ' area-build.log; then
              echo "::error::Unexpected warning(s) in area-panel build (above)"
              exit 1
          fi
