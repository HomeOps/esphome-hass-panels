# Board hardware — Guition ESP32-S3-4848S040
# All pins, display timing, and peripheral config for this specific board.
# Override substitutions in the main YAML to target a different board.
#
# References:
#   https://devices.esphome.io/devices/guition-esp32-s3-4848s040/
#   https://homeding.github.io/boards/esp32s3/panel-4848S040.htm

# Package defaults — match the Guition ESP32-S3-4848S040 reference board.
# Overridable from the entry-point YAML (main config or per-device wrapper)
# to target a different hardware variant without re-declaring every pin.
substitutions:
  display_platform: "st7701s"
  display_width: "480"
  display_height: "480"
  display_rotation: "270"
  display_color_order: "RGB"
  display_invert_colors: "False"
  display_spi_mode: "MODE3"
  display_data_rate: "2MHz"
  display_pclk_frequency: "12MHz"
  display_pclk_inverted: "False"
  display_hsync_pulse_width: "8"
  display_hsync_front_porch: "10"
  display_hsync_back_porch: "20"
  display_vsync_pulse_width: "8"
  display_vsync_front_porch: "10"
  display_vsync_back_porch: "10"
  display_cs_pin: "39"
  display_de_pin: "18"
  display_hsync_pin: "16"
  display_vsync_pin: "17"
  display_pclk_pin: "21"
  spi_clk_pin: "GPIO48"
  spi_mosi_pin: "GPIO47"
  i2c_sda_pin: "GPIO19"
  i2c_scl_pin: "45"
  touchscreen_platform: "gt911"
  backlight_pin: "GPIO38"

# Backlight — ${backlight_pin}, PWM via LEDC
output:
  - platform: ledc
    id: backlight_output
    pin: ${backlight_pin}
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    name: Backlight
    id: display_backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 1s

# SPI bus — display init/config only (display data is RGB parallel)
spi:
  - id: lcd_spi
    clk_pin: ${spi_clk_pin}
    mosi_pin: ${spi_mosi_pin}

# I2C bus — touch controller
i2c:
  id: touchscreen_bus
  sda: ${i2c_sda_pin}
  scl:
    number: ${i2c_scl_pin}
    ignore_strapping_warning: true

# ${display_platform} — 16-bit RGB parallel interface, ${display_width}x${display_height}
display:
  - platform: ${display_platform}
    id: tft_display
    dimensions:
      width: ${display_width}
      height: ${display_height}
    spi_mode: ${display_spi_mode}
    data_rate: ${display_data_rate}
    color_order: ${display_color_order}
    invert_colors: ${display_invert_colors}
    cs_pin: ${display_cs_pin}
    de_pin: ${display_de_pin}
    hsync_pin: ${display_hsync_pin}
    vsync_pin: ${display_vsync_pin}
    pclk_pin: ${display_pclk_pin}
    pclk_frequency: ${display_pclk_frequency}
    pclk_inverted: ${display_pclk_inverted}
    hsync_pulse_width: ${display_hsync_pulse_width}
    hsync_front_porch: ${display_hsync_front_porch}
    hsync_back_porch: ${display_hsync_back_porch}
    vsync_pulse_width: ${display_vsync_pulse_width}
    vsync_front_porch: ${display_vsync_front_porch}
    vsync_back_porch: ${display_vsync_back_porch}
    update_interval: never
    auto_clear_enabled: False
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red:   [11, 12, 13, 14,  0]
      green: [ 8, 20,  3, 46,  9, 10]
      blue:  [ 4,  5,  6,  7, 15]

# Touch-state globals — populated by on_touch, consumed by nav.yaml scripts
globals:
  - id: nav_swipe_start_x
    type: int
    restore_value: no
    initial_value: '-1'
  - id: nav_last_touch_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: nav_swipe_dx
    type: int
    restore_value: no
    initial_value: '0'

# Contract:
#   nav.yaml         defines scripts nav_touch / nav_release.
#   sleep-mode.yaml  defines g_screen_awake, g_swallow_touch, and the
#                    sleep_mode_wake / sleep_mode_auto_off scripts. When the
#                    panel is asleep, the first touch only wakes the backlight
#                    — it does not propagate to swipe tracking or to nav, so a
#                    sleepy hand can't drag the wake gesture into a swipe.
touchscreen:
  - platform: ${touchscreen_platform}
    id: tft_touch
    display: tft_display
    on_touch:
      - if:
          condition:
            lambda: 'return id(sleep_mode_enable).state && !id(g_screen_awake);'
          then:
            - lambda: 'id(g_swallow_touch) = true;'
            - script.execute: sleep_mode_wake
      - if:
          condition:
            lambda: 'return !id(g_swallow_touch);'
          then:
            - lambda: |-
                if (id(nav_swipe_start_x) == -1) id(nav_swipe_start_x) = touch.x;
                id(nav_last_touch_x) = touch.x;
            - script.execute: nav_touch
            - script.execute: sleep_mode_auto_off
    on_release:
      - if:
          condition:
            lambda: 'return id(g_swallow_touch);'
          then:
            - lambda: 'id(g_swallow_touch) = false;'
          else:
            - script.execute: nav_release
