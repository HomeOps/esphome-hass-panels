# nav.yaml — Navigation orchestrator
#
# Responsibilities:
#   - Persistent top navbar with left/right arrows and a status label.
#     The status label shows alarm state (alarm page) or preset·temp (tstat page).
#   - Full-screen "Connecting..." overlay shown on boot and whenever any of the
#     three readiness conditions go false (Wi-Fi, HA API, HA permissions).
#     Panels never see or handle this state.
#   - Swipe left/right cycles the registered panel pages by index.
#     Connecting page is NOT in the swipe cycle.
#   - Auto-return to home page after idle timeout.
#
# Supports up to 4 panel pages. Register them in your instance YAML:
#
#   substitutions:
#     nav_page_1:     alarm_page      # leftmost swipe slot
#     nav_page_2:     thermostat_page
#     nav_page_count: "2"             # how many slots are active (1–4)
#
#   Only set as many nav_page_N as you have active pages. Unused slots default
#   to ${nav_page_1}, so they always resolve to a compiled page — important for
#   slim builds that don't include alarm_page (the unreachable lvgl.page.show
#   branches are still validated at compile time).
#     nav_home_page:  "1"             # 1-based index of the landing page
#                                     # (shown on connect, target of idle return).
#                                     # Defaults to "1". Must be <= nav_page_count.
#
# Contract with board.yaml:
#   board.yaml populates globals nav_swipe_start_x / nav_last_touch_x / nav_swipe_dx
#   and calls scripts nav_touch / nav_release on every touch event.
#
# Contract with UI packages (alarm-keypad-ui, thermostat-ui):
#   Each panel writes its formatted status string to the nav slot(s) that map to
#   that page (g_nav_status_0..g_nav_status_3), then calls nav_refresh_status.
#   nav.yaml renders whichever slot matches the active nav_idx.
#
#   The first time any panel receives entity state from HA it should set
#   g_perms_ok = true and call nav_connection_check — this is the signal that
#   HA has accepted our subscriptions (i.e. permissions granted).

substitutions:
  nav_page_1: alarm_page      # leftmost swipe slot (default first page)
  nav_page_2: ${nav_page_1}   # unused slots fall back to nav_page_1 (safe no-op):
  nav_page_3: ${nav_page_1}   # always a compiled page, so the unreachable
  nav_page_4: ${nav_page_1}   # lvgl.page.show branches still validate in slim builds
  nav_page_count: "1"
  nav_home_page: "1"          # 1-based index of the landing page (1..nav_page_count)
  nav_auto_return_delay: 30s
  nav_bar_height: "60"        # pixels — page content must start below this value

globals:
  - id: nav_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: nav_idx
    type: int
    restore_value: no
    initial_value: '0'
  # Per-slot status strings written by UI packages; nav_refresh_status picks by nav_idx.
  - id: g_nav_status_0
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_nav_status_1
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_nav_status_2
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_nav_status_3
    type: std::string
    restore_value: no
    initial_value: '""'
  # Connecting-overlay readiness flags.
  #   g_wifi_ok  — STA associated and has IP (driven by interval poll below).
  #   g_api_ok   — Native API connected & authenticated (driven by status sensor).
  #   g_perms_ok — HA has answered at least one subscription with state. UI
  #                packages set this from a homeassistant text_sensor on_value.
  - id: g_wifi_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_api_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_perms_ok
    type: bool
    restore_value: no
    initial_value: 'false'

# API connect/disconnect drives g_api_ok. Permissions reset on disconnect since
# any prior subscription is invalidated; they re-arm when entities replay state.
binary_sensor:
  - platform: status
    id: nav_api_status
    on_press:
      - lambda: id(g_api_ok) = true;
      - script.execute: nav_connection_check
    on_release:
      - lambda: |-
          id(g_api_ok) = false;
          id(g_perms_ok) = false;
      - script.execute: nav_connection_check

# Wi-Fi has no event-driven binary_sensor in ESPHome. Poll cheaply and only
# refresh the overlay when the state actually flips.
interval:
  - interval: 2s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - if:
                condition:
                  lambda: 'return !id(g_wifi_ok);'
                then:
                  - lambda: id(g_wifi_ok) = true;
                  - script.execute: nav_connection_check
          else:
            - if:
                condition:
                  lambda: 'return id(g_wifi_ok);'
                then:
                  - lambda: |-
                      id(g_wifi_ok) = false;
                      id(g_api_ok) = false;
                      id(g_perms_ok) = false;
                  - script.execute: nav_connection_check

esphome:
  on_boot:
    priority: -100   # after LVGL is initialised
    then:
      - script.execute: nav_connection_check

script:
  # Called by board.yaml on every touch — resets idle timer.
  - id: nav_touch
    mode: restart
    then:
      - script.execute: auto_return

  # Called by board.yaml on touch release — detects swipe direction.
  - id: nav_release
    then:
      - lambda: |-
          id(nav_swipe_dx) = id(nav_last_touch_x) - id(nav_swipe_start_x);
          id(nav_swipe_start_x) = -1;
      # Swipe left → next panel
      - if:
          condition:
            lambda: return id(nav_connected) && id(nav_swipe_dx) < -80;
          then:
            - lambda: id(nav_idx) = (id(nav_idx) + 1) % ${nav_page_count};
            - script.execute: nav_show_page
      # Swipe right → previous panel
      - if:
          condition:
            lambda: return id(nav_connected) && id(nav_swipe_dx) > 80;
          then:
            - lambda: id(nav_idx) = (id(nav_idx) + ${nav_page_count} - 1) % ${nav_page_count};
            - script.execute: nav_show_page

  # Show the page that matches nav_idx (0-based internal), then refresh
  # the status label. nav_idx == N maps to nav_page_(N+1).
  - id: nav_show_page
    then:
      - if:
          condition: {lambda: return id(nav_idx) == 0;}
          then: [{lvgl.page.show: "${nav_page_1}"}]
      - if:
          condition: {lambda: return id(nav_idx) == 1;}
          then: [{lvgl.page.show: "${nav_page_2}"}]
      - if:
          condition: {lambda: return id(nav_idx) == 2;}
          then: [{lvgl.page.show: "${nav_page_3}"}]
      - if:
          condition: {lambda: return id(nav_idx) == 3;}
          then: [{lvgl.page.show: "${nav_page_4}"}]
      - script.execute: nav_refresh_status

  # Update the navbar status label from the active panel's status string.
  # UI packages call this after updating the per-slot status globals.
  - id: nav_refresh_status
    then:
      - lambda: |-
          if (id(nav_idx) == 0)
            lv_label_set_text(id(lbl_nav_status), id(g_nav_status_0).c_str());
          else if (id(nav_idx) == 1)
            lv_label_set_text(id(lbl_nav_status), id(g_nav_status_1).c_str());
          else if (id(nav_idx) == 2)
            lv_label_set_text(id(lbl_nav_status), id(g_nav_status_2).c_str());
          else if (id(nav_idx) == 3)
            lv_label_set_text(id(lbl_nav_status), id(g_nav_status_3).c_str());
          else
            lv_label_set_text(id(lbl_nav_status), "");

  # Auto-return: only fires when connected; resets to the home page
  # (whichever nav_page_N is selected by nav_home_page).
  - id: auto_return
    mode: restart
    then:
      - delay: ${nav_auto_return_delay}
      - if:
          condition:
            lambda: return id(nav_connected);
          then:
            - lambda: id(nav_idx) = ${nav_home_page} - 1;
            - script.execute: nav_show_page

  # Central readiness handler. Recolours the three step indicators, updates the
  # sub-status hint, and decides whether to show the panel UI or the overlay.
  # Idempotent — safe to call repeatedly from any source (boot, status sensor,
  # WiFi poll, UI packages on first entity state).
  - id: nav_connection_check
    mode: restart
    then:
      # Step 1: Wi-Fi indicator. Wi-Fi is always the first step, so when it's
      # not done it's also "current" → show in HA-blue rather than dim grey.
      - if:
          condition: {lambda: 'return id(g_wifi_ok);'}
          then: [{lvgl.widget.update: {id: ind_wifi, bg_color: 0x66dd66}}]
          else: [{lvgl.widget.update: {id: ind_wifi, bg_color: 0x18BCF2}}]
      # Step 2: HA API indicator. Current step iff Wi-Fi is up but API isn't.
      - if:
          condition: {lambda: 'return id(g_api_ok);'}
          then: [{lvgl.widget.update: {id: ind_api, bg_color: 0x66dd66}}]
          else:
            - if:
                condition: {lambda: 'return id(g_wifi_ok);'}
                then: [{lvgl.widget.update: {id: ind_api, bg_color: 0x18BCF2}}]
                else: [{lvgl.widget.update: {id: ind_api, bg_color: 0x444455}}]
      # Step 3: Permissions indicator. Current step iff API is up but no
      # subscription state has arrived yet.
      - if:
          condition: {lambda: 'return id(g_perms_ok);'}
          then: [{lvgl.widget.update: {id: ind_perms, bg_color: 0x66dd66}}]
          else:
            - if:
                condition: {lambda: 'return id(g_api_ok);'}
                then: [{lvgl.widget.update: {id: ind_perms, bg_color: 0x18BCF2}}]
                else: [{lvgl.widget.update: {id: ind_perms, bg_color: 0x444455}}]
      # Sub-status text — names whichever step is currently blocking.
      - lvgl.label.update:
          id: lbl_connecting_substatus
          text: !lambda |-
            if (!id(g_wifi_ok)) return "Connecting to Wi-Fi...";
            if (!id(g_api_ok)) return "Connecting to Home Assistant...";
            if (!id(g_perms_ok)) return "Waiting for permissions...";
            return "Connected";
      # Overlay vs panel UI. Mirrors nav_connected so the rest of nav.yaml
      # (swipe gating, auto-return) keeps using the same flag.
      - if:
          condition:
            lambda: 'return id(g_wifi_ok) && id(g_api_ok) && id(g_perms_ok);'
          then:
            - lambda: |-
                id(nav_connected) = true;
                id(nav_idx) = ${nav_home_page} - 1;
            - script.stop: anim_connecting_dots
            - lvgl.widget.hide:
                id: connecting_overlay
            - lvgl.widget.show:
                id: navbar
            - script.execute: nav_show_page
          else:
            - lambda: |-
                id(nav_connected) = false;
                id(nav_idx) = ${nav_home_page} - 1;
            - lvgl.widget.hide:
                id: navbar
            - lvgl.widget.show:
                id: connecting_overlay
            - script.execute: anim_connecting_dots

  # Connecting-overlay dot marquee: cycles which of the three dots is lit
  # in HA blue (others dim) on a 300ms tick. `mode: restart` so any caller
  # can always (re)start it idempotently; the while loop terminates on its
  # own once nav_connected flips true.
  - id: anim_connecting_dots
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return !id(nav_connected);'
          then:
            - lvgl.widget.update: {id: dot_0, bg_color: 0x18BCF2}
            - lvgl.widget.update: {id: dot_1, bg_color: 0x2a3a55}
            - lvgl.widget.update: {id: dot_2, bg_color: 0x2a3a55}
            - delay: 300ms
            - lvgl.widget.update: {id: dot_0, bg_color: 0x2a3a55}
            - lvgl.widget.update: {id: dot_1, bg_color: 0x18BCF2}
            - lvgl.widget.update: {id: dot_2, bg_color: 0x2a3a55}
            - delay: 300ms
            - lvgl.widget.update: {id: dot_0, bg_color: 0x2a3a55}
            - lvgl.widget.update: {id: dot_1, bg_color: 0x2a3a55}
            - lvgl.widget.update: {id: dot_2, bg_color: 0x18BCF2}
            - delay: 300ms

# Large MDI glyph used only by the connecting overlay — a separate font so it
# can be rendered at a logo-sized 96px without inflating the general-purpose
# icon font used on the keypad / thermostat pages.
font:
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: ha_logo_icon
    size: 96
    glyphs:
      - "\U000F07D0"  # mdi:home-assistant

# top_layer — always rendered above pages.
# Declaration order: navbar first (lower z), connecting_overlay second (higher z).
# When the overlay is shown it covers the navbar completely.
lvgl:
  top_layer:
    widgets:

      # ── Navbar ─────────────────────────────────────────────────────
      # Hidden until HA connects (connecting_overlay covers anyway, but hidden
      # prevents it briefly flashing on first boot before the overlay renders).
      - obj:
          id: navbar
          x: 0
          y: 0
          width: ${display_width}
          height: ${nav_bar_height}
          bg_color: 0x16213e
          bg_opa: COVER
          radius: 0
          border_width: 0
          border_side: BOTTOM
          border_color: 0x0f3460
          pad_all: 0
          hidden: true
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: START
            flex_align_cross: CENTER
          widgets:

            # Left arrow — go to previous page
            - button:
                id: btn_nav_left
                width: ${nav_bar_height}
                height: ${nav_bar_height}
                bg_color: 0x16213e
                bg_opa: COVER
                radius: 0
                border_width: 0
                widgets:
                  - label:
                      align: CENTER
                      text: "<"
                      text_font: montserrat_28
                      text_color: 0x4060a0
                on_press:
                  - lambda: id(nav_idx) = (id(nav_idx) + ${nav_page_count} - 1) % ${nav_page_count};
                  - script.execute: nav_show_page

            # Status label — filled by nav_refresh_status.
            # Intentionally no `height:` override: LVGL labels render text
            # top-aligned inside their bounding box, so a label pinned to the
            # full navbar height pushes the text to the top. Letting the label
            # auto-size lets the row flex's `flex_align_cross: CENTER` do the
            # vertical centring correctly.
            - label:
                id: lbl_nav_status
                flex_grow: 1
                text: ""
                align: CENTER
                text_align: CENTER
                text_color: 0xffffff
                text_font: montserrat_28
                long_mode: SCROLL_CIRCULAR

            # Right arrow — go to next page
            - button:
                id: btn_nav_right
                width: ${nav_bar_height}
                height: ${nav_bar_height}
                bg_color: 0x16213e
                bg_opa: COVER
                radius: 0
                border_width: 0
                widgets:
                  - label:
                      align: CENTER
                      text: ">"
                      text_font: montserrat_28
                      text_color: 0x4060a0
                on_press:
                  - lambda: id(nav_idx) = (id(nav_idx) + 1) % ${nav_page_count};
                  - script.execute: nav_show_page

      # ── Connecting overlay ─────────────────────────────────────────
      # Full-screen, covers navbar. Layout (all children `align: CENTER`,
      # y relative to screen centre at 240px):
      #   y=-180   HA logo (96px icon)         — spans roughly y=12..108
      #   y=-100   "Connecting" title          (montserrat_28, ~36px)
      #   y= -50   Wi-Fi status row            (14px dot + label)
      #   y= -10   Home Assistant status row
      #   y= +30   Permissions status row
      #   y= +90   three 14px dots             — animated by anim_connecting_dots
      #   y=+140   sub-status hint             (which step is blocking)
      #   y=+210   "vX.Y.Z" firmware           (montserrat_14, dim)
      #
      # Indicator colours (set by nav_connection_check):
      #   0x444455 — pending (a future step, dim grey)
      #   0x18BCF2 — current step in flight   (HA brand blue)
      #   0x66dd66 — done                      (green)
      - obj:
          id: connecting_overlay
          x: 0
          y: 0
          width: ${display_width}
          height: ${display_height}
          bg_color: 0x1a1a2e
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          scrollbar_mode: "off"
          scrollable: false
          hidden: false
          widgets:
            - label:
                align: CENTER
                y: -180
                text: "\U000F07D0"          # mdi:home-assistant
                text_font: ha_logo_icon
                text_color: 0x18BCF2        # Home Assistant brand blue
            - label:
                align: CENTER
                y: -100
                text: "Connecting"
                text_font: montserrat_28
                text_color: 0xffffff

            # ── Wi-Fi status row ─────────────────────────────────
            - obj:
                align: CENTER
                y: -50
                width: 240
                height: 24
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollbar_mode: "off"
                scrollable: false
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_main: START
                  flex_align_cross: CENTER
                  pad_column: 12
                widgets:
                  - obj:
                      id: ind_wifi
                      width: 14
                      height: 14
                      radius: 7
                      border_width: 0
                      pad_all: 0
                      bg_color: 0x444455
                      bg_opa: COVER
                      scrollbar_mode: "off"
                      scrollable: false
                  - label:
                      text: "Wi-Fi"
                      text_font: montserrat_18
                      text_color: 0xcccccc

            # ── HA API status row ────────────────────────────────
            - obj:
                align: CENTER
                y: -10
                width: 240
                height: 24
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollbar_mode: "off"
                scrollable: false
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_main: START
                  flex_align_cross: CENTER
                  pad_column: 12
                widgets:
                  - obj:
                      id: ind_api
                      width: 14
                      height: 14
                      radius: 7
                      border_width: 0
                      pad_all: 0
                      bg_color: 0x444455
                      bg_opa: COVER
                      scrollbar_mode: "off"
                      scrollable: false
                  - label:
                      text: "Home Assistant"
                      text_font: montserrat_18
                      text_color: 0xcccccc

            # ── Permissions status row ───────────────────────────
            - obj:
                align: CENTER
                y: 30
                width: 240
                height: 24
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollbar_mode: "off"
                scrollable: false
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_main: START
                  flex_align_cross: CENTER
                  pad_column: 12
                widgets:
                  - obj:
                      id: ind_perms
                      width: 14
                      height: 14
                      radius: 7
                      border_width: 0
                      pad_all: 0
                      bg_color: 0x444455
                      bg_opa: COVER
                      scrollbar_mode: "off"
                      scrollable: false
                  - label:
                      text: "Permissions"
                      text_font: montserrat_18
                      text_color: 0xcccccc

            # ── Activity dots ────────────────────────────────────
            # Dots rather than an LVGL spinner: the built-in spinner's track arc
            # and inner fill defaulted to opaque styles that obscured the
            # animation under the dark overlay. Three plain obj circles driven
            # by a tight script are simpler and render reliably.
            - obj:
                id: dot_0
                align: CENTER
                x: -30
                y: 90
                width: 14
                height: 14
                radius: 7
                border_width: 0
                pad_all: 0
                bg_color: 0x2a3a55
                bg_opa: COVER
                scrollbar_mode: "off"
                scrollable: false
            - obj:
                id: dot_1
                align: CENTER
                x: 0
                y: 90
                width: 14
                height: 14
                radius: 7
                border_width: 0
                pad_all: 0
                bg_color: 0x2a3a55
                bg_opa: COVER
                scrollbar_mode: "off"
                scrollable: false
            - obj:
                id: dot_2
                align: CENTER
                x: 30
                y: 90
                width: 14
                height: 14
                radius: 7
                border_width: 0
                pad_all: 0
                bg_color: 0x2a3a55
                bg_opa: COVER
                scrollbar_mode: "off"
                scrollable: false

            # ── Sub-status hint ──────────────────────────────────
            - label:
                id: lbl_connecting_substatus
                align: CENTER
                y: 140
                text: "Connecting to Wi-Fi..."
                text_font: montserrat_18
                text_color: 0x888888

            # Firmware version — single source of truth is the
            # esphome.project.version field in esp32-hass-panel.yaml,
            # bumped automatically by release-please.
            - label:
                align: CENTER
                y: 210
                text: !lambda 'return std::string("v") + ESPHOME_PROJECT_VERSION;'
                text_font: montserrat_14
                text_color: 0x555555
