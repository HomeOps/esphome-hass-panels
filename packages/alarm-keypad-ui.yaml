# Alarm keypad UI — LVGL interface wired to Home Assistant alarm_control_panel
# This package provides an LVGL page with the alarm keypad.
# It is board-independent — include it alongside a board package.
#
# Layout (480×480 display, nav_bar_height=60):
#   y=  0..59  — navbar (top_layer, handled by nav.yaml)
#   y= 65..128 — keypad row 0  (1 2 3)
#   y=135..198 — keypad row 1  (4 5 6)
#   y=205..268 — keypad row 2  (7 8 9)
#   y=275..338 — keypad row 3  (CLR 0 OK)
#   y=345..408 — ARM / DISARM row
#   y=415..470 — status bar (alarm state display)
#
# Navbar contract (nav.yaml):
#   Writes formatted alarm state to any nav slot mapped to alarm_page, then calls
#   nav_refresh_status.

globals:
  - id: entered_code
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: disarm_requires_code
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: arm_requires_code
    type: bool
    restore_value: no
    initial_value: 'false'
  # 0=disarm  1=arm_away  2=arm_home  3=arm_night
  - id: pending_action
    type: int
    restore_value: no
    initial_value: '0'

text_sensor:
  - platform: homeassistant
    id: alarm_code_arm_required
    entity_id: ${alarm_entity_id}
    attribute: code_arm_required
    on_value:
      - lambda: id(arm_requires_code) = (x == "true");

  - platform: homeassistant
    id: alarm_code_disarm_required
    entity_id: ${alarm_entity_id}
    attribute: code_disarm_required
    on_value:
      - lambda: id(disarm_requires_code) = (x == "true");

  - platform: homeassistant
    id: alarm_state
    entity_id: ${alarm_entity_id}
    on_value:
      # First entity state from HA confirms our subscription was accepted —
      # that's the signal nav.yaml uses to flip the "Permissions" indicator.
      - if:
          condition:
            lambda: 'return !id(g_perms_ok);'
          then:
            - lambda: id(g_perms_ok) = true;
            - script.execute: nav_connection_check
      # Feed navbar status label and status bar
      - lambda: |-
          std::string txt;
          if      (x == "disarmed")   txt = "DISARMED";
          else if (x == "armed_away") txt = "ARMED AWAY";
          else if (x == "armed_home") txt = "ARMED HOME";
          else if (x == "arming")     txt = "ARMING...";
          else if (x == "disarming")  txt = "DISARMING...";
          else if (x == "pending")    txt = "PENDING...";
          else if (x == "triggered")  txt = "!! TRIGGERED !!";
          else txt = x;
          if (strcmp("${nav_home_page}", "alarm_page") == 0) id(g_nav_status_0) = txt;
          if (strcmp("${nav_page_1}", "alarm_page") == 0) id(g_nav_status_1) = txt;
          if (strcmp("${nav_page_2}", "alarm_page") == 0) id(g_nav_status_2) = txt;
          if (strcmp("${nav_page_3}", "alarm_page") == 0) id(g_nav_status_3) = txt;
      # Update status bar with state and appropriate color
      - lvgl.label.update:
          id: lbl_alarm_status
          text: !lambda |-
            if (x == "disarmed") return "DISARMED";
            else if (x == "armed_away") return "ARMED AWAY";
            else if (x == "armed_home") return "ARMED HOME";
            else if (x == "arming") return "ARMING";
            else if (x == "disarming") return "DISARMING";
            else if (x == "pending") return "PENDING";
            else if (x == "triggered") return "TRIGGERED";
            else return x.c_str();
      - if:
          condition:
            lambda: return x == "disarmed";
          then:
            - lvgl.label.update:
                id: lbl_alarm_status
                text_color: 0x88dd88
      - if:
          condition:
            lambda: return x == "armed_away" || x == "armed_home";
          then:
            - lvgl.label.update:
                id: lbl_alarm_status
                text_color: 0x66aaff
      - if:
          condition:
            lambda: return x == "arming" || x == "disarming" || x == "pending";
          then:
            - lvgl.label.update:
                id: lbl_alarm_status
                text_color: 0xffaa33
      - if:
          condition:
            lambda: return x == "triggered";
          then:
            - lvgl.label.update:
                id: lbl_alarm_status
                text_color: 0xff4444
      - script.execute: code_overlay_refresh
      # Drive ARM/DISARM button visibility and animations
      - script.stop: anim_arming
      - script.stop: anim_triggered
      - if:
          condition:
            lambda: return x == "disarmed";
          then:
            - lvgl.widget.show:
                id: arm_buttons_row
            - lvgl.widget.hide:
                id: disarm_btn
      - if:
          condition:
            lambda: return x == "arming" || x == "pending" || x == "disarming";
          then:
            - lvgl.widget.hide:
                id: arm_buttons_row
            - lvgl.widget.show:
                id: disarm_btn
            - script.execute: anim_arming
      - if:
          condition:
            lambda: return x == "triggered";
          then:
            - lvgl.widget.hide:
                id: arm_buttons_row
            - lvgl.widget.show:
                id: disarm_btn
            - script.execute: anim_triggered
      - if:
          condition:
            lambda: return x == "armed_away" || x == "armed_home" || x == "armed_night";
          then:
            - lvgl.widget.hide:
                id: arm_buttons_row
            - lvgl.widget.show:
                id: disarm_btn
            - lvgl.button.update:
                id: disarm_btn
                bg_color: 0xe94560

script:
  # When digits are entered, show * overlay in navbar status; otherwise restore
  # the live status text from nav.yaml.
  - id: code_overlay_refresh
    then:
      - if:
          condition:
            lambda: return id(entered_code).empty();
          then:
            - script.execute: nav_refresh_status
          else:
            - lvgl.label.update:
                id: lbl_nav_status
                text: !lambda return std::string(id(entered_code).size(), '*');

  # Slow orange pulse — arming / pending / disarming
  - id: anim_arming
    mode: restart
    then:
      - while:
          condition:
            lambda: return true;
          then:
            - lvgl.button.update:
                id: disarm_btn
                bg_color: 0xff8800
            - delay: 700ms
            - lvgl.button.update:
                id: disarm_btn
                bg_color: 0x3a2000
            - delay: 700ms

  # Fast red strobe — triggered
  - id: anim_triggered
    mode: restart
    then:
      - while:
          condition:
            lambda: return true;
          then:
            - lvgl.button.update:
                id: disarm_btn
                bg_color: 0xff0000
            - delay: 250ms
            - lvgl.button.update:
                id: disarm_btn
                bg_color: 0x1a0000
            - delay: 250ms

font:
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons
    size: 40
    glyphs:
      - "\U000F033E"  # mdi:lock          → ARM AWAY
      - "\U000F0498"  # mdi:shield        → ARM HOME
      - "\U000F0594"  # mdi:weather-night → ARM NIGHT
      - "\U000F099E"  # mdi:shield-off    → DISARM

lvgl:
  pages:
    - id: alarm_page
      widgets:
        - obj:
            width: ${display_width}
            height: ${display_height}
            pad_all: 0
            bg_color: 0x1a1a2e
            border_width: 0
            scrollbar_mode: "off"
            scrollable: false
            widgets:

              # ── Row 0: 1 2 3  y=65 ──────────────────────────────
              - obj:
                  x: 10
                  y: 65
                  width: 460
                  height: 64
                  bg_color: 0x1a1a2e
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: STRETCH
                  widgets:
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "1";
                          - script.execute: code_overlay_refresh
                        widgets:
                          - label: {text: "1", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "2";
                          - script.execute: code_overlay_refresh
                        widgets:
                          - label: {text: "2", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "3";
                          - script.execute: code_overlay_refresh
                        widgets:
                          - label: {text: "3", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}

              # ── Row 1: 4 5 6  y=135 ─────────────────────────────
              - obj:
                  x: 10
                  y: 135
                  width: 460
                  height: 64
                  bg_color: 0x1a1a2e
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: STRETCH
                  widgets:
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "4";
                          - script.execute: code_overlay_refresh
                        widgets:
                          - label: {text: "4", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "5";
                          - script.execute: code_overlay_refresh
                        widgets:
                          - label: {text: "5", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "6";
                          - script.execute: code_overlay_refresh
                        widgets:
                          - label: {text: "6", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}

              # ── Row 2: 7 8 9  y=205 ─────────────────────────────
              - obj:
                  x: 10
                  y: 205
                  width: 460
                  height: 64
                  bg_color: 0x1a1a2e
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: STRETCH
                  widgets:
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "7";
                          - script.execute: code_overlay_refresh
                        widgets:
                          - label: {text: "7", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "8";
                          - script.execute: code_overlay_refresh
                        widgets:
                          - label: {text: "8", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "9";
                          - script.execute: code_overlay_refresh
                        widgets:
                          - label: {text: "9", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}

              # ── Row 3: CLR 0 OK  y=275 ──────────────────────────
              - obj:
                  x: 10
                  y: 275
                  width: 460
                  height: 64
                  bg_color: 0x1a1a2e
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: STRETCH
                  widgets:
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x0f3460
                        on_press:
                          - lambda: |-
                              if (!id(entered_code).empty())
                                id(entered_code).pop_back();
                          - script.execute: code_overlay_refresh
                          - if:
                              condition:
                                lambda: return id(entered_code).empty();
                              then:
                                - lvgl.label.update:
                                    id: lbl_disarm_btn
                                    text: "\U000F099E"
                                    text_font: mdi_icons
                        widgets:
                          - label: {text: "CLR", align: CENTER, text_font: montserrat_22, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "0";
                          - script.execute: code_overlay_refresh
                        widgets:
                          - label: {text: "0", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x0f3460
                        on_press:
                          - if:
                              condition:
                                lambda: return id(pending_action) == 0;
                              then:
                                - homeassistant.service:
                                    service: alarm_control_panel.alarm_disarm
                                    data:
                                      entity_id: ${alarm_entity_id}
                                      code: !lambda return id(entered_code);
                          - if:
                              condition:
                                lambda: return id(pending_action) == 1;
                              then:
                                - homeassistant.service:
                                    service: alarm_control_panel.alarm_arm_away
                                    data:
                                      entity_id: ${alarm_entity_id}
                                      code: !lambda return id(entered_code);
                          - if:
                              condition:
                                lambda: return id(pending_action) == 2;
                              then:
                                - homeassistant.service:
                                    service: alarm_control_panel.alarm_arm_home
                                    data:
                                      entity_id: ${alarm_entity_id}
                                      code: !lambda return id(entered_code);
                          - if:
                              condition:
                                lambda: return id(pending_action) == 3;
                              then:
                                - homeassistant.service:
                                    service: alarm_control_panel.alarm_arm_night
                                    data:
                                      entity_id: ${alarm_entity_id}
                                      code: !lambda return id(entered_code);
                          - lambda: id(entered_code) = ""; id(pending_action) = 0;
                          - script.execute: code_overlay_refresh
                          - lvgl.label.update:
                              id: lbl_disarm_btn
                              text: "\U000F099E"
                              text_font: mdi_icons
                        widgets:
                          - label: {text: "OK", align: CENTER, text_font: montserrat_22, text_color: 0xffffff}

              # ── ARM buttons row  y=345 — shown when disarmed ─────
              - obj:
                  id: arm_buttons_row
                  x: 10
                  y: 345
                  width: 460
                  height: 64
                  bg_color: 0x1a1a2e
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: STRETCH
                  widgets:
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x0f3460
                        on_press:
                          - lambda: id(pending_action) = 1;
                          - if:
                              condition:
                                lambda: return id(arm_requires_code);
                              then:
                                - lambda: id(entered_code) = "";
                                - script.execute: code_overlay_refresh
                              else:
                                - homeassistant.service:
                                    service: alarm_control_panel.alarm_arm_away
                                    data:
                                      entity_id: ${alarm_entity_id}
                        widgets:
                          - label:
                              text: "\U000F033E"
                              align: CENTER
                              text_font: mdi_icons
                              text_color: 0xffffff
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x0f3460
                        on_press:
                          - lambda: id(pending_action) = 2;
                          - if:
                              condition:
                                lambda: return id(arm_requires_code);
                              then:
                                - lambda: id(entered_code) = "";
                                - script.execute: code_overlay_refresh
                              else:
                                - homeassistant.service:
                                    service: alarm_control_panel.alarm_arm_home
                                    data:
                                      entity_id: ${alarm_entity_id}
                        widgets:
                          - label:
                              text: "\U000F0498"
                              align: CENTER
                              text_font: mdi_icons
                              text_color: 0xffffff
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x0f3460
                        on_press:
                          - lambda: id(pending_action) = 3;
                          - if:
                              condition:
                                lambda: return id(arm_requires_code);
                              then:
                                - lambda: id(entered_code) = "";
                                - script.execute: code_overlay_refresh
                              else:
                                - homeassistant.service:
                                    service: alarm_control_panel.alarm_arm_night
                                    data:
                                      entity_id: ${alarm_entity_id}
                        widgets:
                          - label:
                              text: "\U000F0594"
                              align: CENTER
                              text_font: mdi_icons
                              text_color: 0xffffff

              # ── DISARM button  y=345 — shown when armed/triggered ─
              - button:
                  id: disarm_btn
                  x: 10
                  y: 345
                  width: 460
                  height: 64
                  bg_color: 0xe94560
                  hidden: true
                  on_press:
                    - lambda: id(pending_action) = 0;
                    - if:
                        condition:
                          lambda: return id(disarm_requires_code);
                        then:
                          - lvgl.label.update:
                              id: lbl_disarm_btn
                              text: "PIN"
                              text_font: montserrat_28
                        else:
                          - homeassistant.service:
                              service: alarm_control_panel.alarm_disarm
                              data:
                                entity_id: ${alarm_entity_id}
                                code: ""
                  widgets:
                    - label:
                        id: lbl_disarm_btn
                        text: "\U000F099E"
                        align: CENTER
                        text_font: mdi_icons
                        text_color: 0xffffff

              # ── Status bar — shows current alarm state  y=415–470 ────
              # No inner FLEX layout: a FLEX container overrides `align:` on
              # children, and cross-axis centring of a content-sized label
              # silently landed the text flush-left. Plain `align: CENTER` on
              # the single child works reliably.
              - obj:
                  x: 10
                  y: 415
                  width: 460
                  height: 55
                  bg_color: 0x0a0a14
                  bg_opa: COVER
                  radius: 8
                  border_width: 1
                  border_color: 0x0f3460
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  widgets:
                    - label:
                        id: lbl_alarm_status
                        text: "DISARMED"
                        align: CENTER
                        text_align: CENTER
                        text_font: montserrat_18
                        text_color: 0x88dd88
