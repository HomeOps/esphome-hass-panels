# Alarm keypad UI — LVGL interface wired to Home Assistant alarm_control_panel
# This package provides an LVGL page with the alarm keypad.
# It is board-independent — include it alongside a board package.
#
# Layout (480×480 display, nav_bar_height=60):
#   y=  0..59  — navbar (top_layer, handled by nav.yaml)
#   y= 65..108 — code-entry display bar (always visible; empty when idle)
#   y=115..178 — keypad row 0  (1 2 3)
#   y=185..248 — keypad row 1  (4 5 6)
#   y=255..318 — keypad row 2  (7 8 9)
#   y=325..388 — keypad row 3  (CLR 0 OK)
#   y=395..458 — ARM / DISARM row
#
# Navbar contract (nav.yaml):
#   Writes formatted alarm state to g_nav_alarm_status and calls nav_refresh_status.

globals:
  - id: entered_code
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: disarm_requires_code
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: arm_requires_code
    type: bool
    restore_value: no
    initial_value: 'false'
  # 0=disarm  1=arm_away  2=arm_home  3=arm_night
  - id: pending_action
    type: int
    restore_value: no
    initial_value: '0'

text_sensor:
  - platform: homeassistant
    id: alarm_code_arm_required
    entity_id: ${alarm_entity_id}
    attribute: code_arm_required
    on_value:
      - lambda: id(arm_requires_code) = (x == "true");

  - platform: homeassistant
    id: alarm_code_disarm_required
    entity_id: ${alarm_entity_id}
    attribute: code_disarm_required
    on_value:
      - lambda: id(disarm_requires_code) = (x == "true");

  - platform: homeassistant
    id: alarm_state
    entity_id: ${alarm_entity_id}
    on_value:
      # Feed navbar status label
      - lambda: |-
          std::string txt;
          if      (x == "disarmed")   txt = "DISARMED";
          else if (x == "armed_away") txt = "ARMED AWAY";
          else if (x == "armed_home") txt = "ARMED HOME";
          else if (x == "arming")     txt = "ARMING...";
          else if (x == "disarming")  txt = "DISARMING...";
          else if (x == "pending")    txt = "PENDING...";
          else if (x == "triggered")  txt = "!! TRIGGERED !!";
          else txt = x;
          id(g_nav_alarm_status) = txt;
      - script.execute: nav_refresh_status
      # Drive ARM/DISARM button visibility and animations
      - script.stop: anim_arming
      - script.stop: anim_triggered
      - if:
          condition:
            lambda: return x == "disarmed";
          then:
            - lvgl.widget.show:
                id: arm_buttons_row
            - lvgl.widget.hide:
                id: disarm_btn
      - if:
          condition:
            lambda: return x == "arming" || x == "pending" || x == "disarming";
          then:
            - lvgl.widget.hide:
                id: arm_buttons_row
            - lvgl.widget.show:
                id: disarm_btn
            - script.execute: anim_arming
      - if:
          condition:
            lambda: return x == "triggered";
          then:
            - lvgl.widget.hide:
                id: arm_buttons_row
            - lvgl.widget.show:
                id: disarm_btn
            - script.execute: anim_triggered
      - if:
          condition:
            lambda: return x == "armed_away" || x == "armed_home" || x == "armed_night";
          then:
            - lvgl.widget.hide:
                id: arm_buttons_row
            - lvgl.widget.show:
                id: disarm_btn
            - lvgl.button.update:
                id: disarm_btn
                bg_color: 0xe94560

script:
  # Slow orange pulse — arming / pending / disarming
  - id: anim_arming
    mode: restart
    then:
      - while:
          condition:
            lambda: return true;
          then:
            - lvgl.button.update:
                id: disarm_btn
                bg_color: 0xff8800
            - delay: 700ms
            - lvgl.button.update:
                id: disarm_btn
                bg_color: 0x3a2000
            - delay: 700ms

  # Fast red strobe — triggered
  - id: anim_triggered
    mode: restart
    then:
      - while:
          condition:
            lambda: return true;
          then:
            - lvgl.button.update:
                id: disarm_btn
                bg_color: 0xff0000
            - delay: 250ms
            - lvgl.button.update:
                id: disarm_btn
                bg_color: 0x1a0000
            - delay: 250ms

font:
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons
    size: 40
    glyphs:
      - "\U000F099F"  # mdi:shield-lock   → ARM AWAY
      - "\U000F068A"  # mdi:shield-home   → ARM HOME
      - "\U000F0594"  # mdi:weather-night → ARM NIGHT
      - "\U000F0FF2"  # mdi:shield-off    → DISARM

lvgl:
  pages:
    - id: alarm_page
      widgets:
        - obj:
            width: ${display_width}
            height: ${display_height}
            pad_all: 0
            bg_color: 0x1a1a2e
            border_width: 0
            scrollbar_mode: "off"
            scrollable: false
            widgets:

              # ── Code display bar ─────────────────────────────────
              # Always visible below the navbar; shows asterisks while typing.
              - obj:
                  id: code_display
                  x: 10
                  y: 65
                  width: 460
                  height: 44
                  bg_color: 0x16213e
                  radius: 8
                  border_width: 1
                  border_color: 0x0f3460
                  scrollbar_mode: "off"
                  scrollable: false
                  widgets:
                    - label:
                        id: lbl_code
                        align: CENTER
                        text: ""
                        text_font: montserrat_28
                        text_color: 0xe94560

              # ── Row 0: 1 2 3  y=115 ─────────────────────────────
              - obj:
                  x: 10
                  y: 115
                  width: 460
                  height: 64
                  bg_color: 0x1a1a2e
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: STRETCH
                  widgets:
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "1";
                          - lvgl.label.update:
                              id: lbl_code
                              text: !lambda return std::string(id(entered_code).size(), '*');
                        widgets:
                          - label: {text: "1", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "2";
                          - lvgl.label.update:
                              id: lbl_code
                              text: !lambda return std::string(id(entered_code).size(), '*');
                        widgets:
                          - label: {text: "2", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "3";
                          - lvgl.label.update:
                              id: lbl_code
                              text: !lambda return std::string(id(entered_code).size(), '*');
                        widgets:
                          - label: {text: "3", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}

              # ── Row 1: 4 5 6  y=185 ─────────────────────────────
              - obj:
                  x: 10
                  y: 185
                  width: 460
                  height: 64
                  bg_color: 0x1a1a2e
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: STRETCH
                  widgets:
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "4";
                          - lvgl.label.update:
                              id: lbl_code
                              text: !lambda return std::string(id(entered_code).size(), '*');
                        widgets:
                          - label: {text: "4", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "5";
                          - lvgl.label.update:
                              id: lbl_code
                              text: !lambda return std::string(id(entered_code).size(), '*');
                        widgets:
                          - label: {text: "5", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "6";
                          - lvgl.label.update:
                              id: lbl_code
                              text: !lambda return std::string(id(entered_code).size(), '*');
                        widgets:
                          - label: {text: "6", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}

              # ── Row 2: 7 8 9  y=255 ─────────────────────────────
              - obj:
                  x: 10
                  y: 255
                  width: 460
                  height: 64
                  bg_color: 0x1a1a2e
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: STRETCH
                  widgets:
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "7";
                          - lvgl.label.update:
                              id: lbl_code
                              text: !lambda return std::string(id(entered_code).size(), '*');
                        widgets:
                          - label: {text: "7", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "8";
                          - lvgl.label.update:
                              id: lbl_code
                              text: !lambda return std::string(id(entered_code).size(), '*');
                        widgets:
                          - label: {text: "8", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "9";
                          - lvgl.label.update:
                              id: lbl_code
                              text: !lambda return std::string(id(entered_code).size(), '*');
                        widgets:
                          - label: {text: "9", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}

              # ── Row 3: CLR 0 OK  y=325 ──────────────────────────
              - obj:
                  x: 10
                  y: 325
                  width: 460
                  height: 64
                  bg_color: 0x1a1a2e
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: STRETCH
                  widgets:
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x0f3460
                        on_press:
                          - lambda: |-
                              if (!id(entered_code).empty())
                                id(entered_code).pop_back();
                          - lvgl.label.update:
                              id: lbl_code
                              text: !lambda return std::string(id(entered_code).size(), '*');
                          - if:
                              condition:
                                lambda: return id(entered_code).empty();
                              then:
                                - lvgl.label.update:
                                    id: lbl_disarm_btn
                                    text: "\U000F0FF2"
                                    text_font: mdi_icons
                        widgets:
                          - label: {text: "CLR", align: CENTER, text_font: montserrat_22, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x16213e
                        on_press:
                          - lambda: id(entered_code) += "0";
                          - lvgl.label.update:
                              id: lbl_code
                              text: !lambda return std::string(id(entered_code).size(), '*');
                        widgets:
                          - label: {text: "0", align: CENTER, text_font: montserrat_28, text_color: 0xffffff}
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x0f3460
                        on_press:
                          - if:
                              condition:
                                lambda: return id(pending_action) == 0;
                              then:
                                - homeassistant.service:
                                    service: alarm_control_panel.alarm_disarm
                                    data:
                                      entity_id: ${alarm_entity_id}
                                      code: !lambda return id(entered_code);
                          - if:
                              condition:
                                lambda: return id(pending_action) == 1;
                              then:
                                - homeassistant.service:
                                    service: alarm_control_panel.alarm_arm_away
                                    data:
                                      entity_id: ${alarm_entity_id}
                                      code: !lambda return id(entered_code);
                          - if:
                              condition:
                                lambda: return id(pending_action) == 2;
                              then:
                                - homeassistant.service:
                                    service: alarm_control_panel.alarm_arm_home
                                    data:
                                      entity_id: ${alarm_entity_id}
                                      code: !lambda return id(entered_code);
                          - if:
                              condition:
                                lambda: return id(pending_action) == 3;
                              then:
                                - homeassistant.service:
                                    service: alarm_control_panel.alarm_arm_night
                                    data:
                                      entity_id: ${alarm_entity_id}
                                      code: !lambda return id(entered_code);
                          - lambda: id(entered_code) = ""; id(pending_action) = 0;
                          - lvgl.label.update:
                              id: lbl_code
                              text: ""
                          - lvgl.label.update:
                              id: lbl_disarm_btn
                              text: "\U000F0FF2"
                              text_font: mdi_icons
                        widgets:
                          - label: {text: "OK", align: CENTER, text_font: montserrat_22, text_color: 0xffffff}

              # ── ARM buttons row  y=395 — shown when disarmed ─────
              - obj:
                  id: arm_buttons_row
                  x: 10
                  y: 395
                  width: 460
                  height: 64
                  bg_color: 0x1a1a2e
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: STRETCH
                  widgets:
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x0f3460
                        on_press:
                          - lambda: id(pending_action) = 1;
                          - if:
                              condition:
                                lambda: return id(arm_requires_code);
                              then:
                                - lvgl.label.update:
                                    id: lbl_code
                                    text: ""
                              else:
                                - homeassistant.service:
                                    service: alarm_control_panel.alarm_arm_away
                                    data:
                                      entity_id: ${alarm_entity_id}
                        widgets:
                          - label:
                              text: "\U000F099F"
                              align: CENTER
                              text_font: mdi_icons
                              text_color: 0xffffff
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x0f3460
                        on_press:
                          - lambda: id(pending_action) = 2;
                          - if:
                              condition:
                                lambda: return id(arm_requires_code);
                              then:
                                - lvgl.label.update:
                                    id: lbl_code
                                    text: ""
                              else:
                                - homeassistant.service:
                                    service: alarm_control_panel.alarm_arm_home
                                    data:
                                      entity_id: ${alarm_entity_id}
                        widgets:
                          - label:
                              text: "\U000F068A"
                              align: CENTER
                              text_font: mdi_icons
                              text_color: 0xffffff
                    - button:
                        width: 148
                        height: 64
                        bg_color: 0x0f3460
                        on_press:
                          - lambda: id(pending_action) = 3;
                          - if:
                              condition:
                                lambda: return id(arm_requires_code);
                              then:
                                - lvgl.label.update:
                                    id: lbl_code
                                    text: ""
                              else:
                                - homeassistant.service:
                                    service: alarm_control_panel.alarm_arm_night
                                    data:
                                      entity_id: ${alarm_entity_id}
                        widgets:
                          - label:
                              text: "\U000F0594"
                              align: CENTER
                              text_font: mdi_icons
                              text_color: 0xffffff

              # ── DISARM button  y=395 — shown when armed/triggered ─
              - button:
                  id: disarm_btn
                  x: 10
                  y: 395
                  width: 460
                  height: 64
                  bg_color: 0xe94560
                  hidden: true
                  on_press:
                    - lambda: id(pending_action) = 0;
                    - if:
                        condition:
                          lambda: return id(disarm_requires_code);
                        then:
                          - lvgl.label.update:
                              id: lbl_disarm_btn
                              text: "PIN"
                              text_font: montserrat_28
                        else:
                          - homeassistant.service:
                              service: alarm_control_panel.alarm_disarm
                              data:
                                entity_id: ${alarm_entity_id}
                                code: ""
                  widgets:
                    - label:
                        id: lbl_disarm_btn
                        text: "\U000F0FF2"
                        align: CENTER
                        text_font: mdi_icons
                        text_color: 0xffffff
