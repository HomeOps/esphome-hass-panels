# Opt-in 16MB flash layout — enlarged OTA app slots.
#
# DEFAULT (this package NOT included): ESPHome's 4MB layout, ~1.75MB per OTA
# app slot. OTA-friendly — no cable ever needed.
#
# Include this alongside core (or the full bundle) on a device whose firmware
# has outgrown the default 1.75MB slot. Setting flash_size: 16MB makes
# ESPHome auto-generate ~7.75MB OTA app slots:
#
#   packages:
#     core:  {url: ..., file: packages/core.yaml}
#     ...    # your UI pages
#     flash: {url: ..., file: packages/flash-16mb.yaml}   # <- opt-in
#
# IMPORTANT — this is a partition-table change:
#   * It takes effect ONLY via a one-time USB-serial flash. OTA never
#     rewrites the partition table, so you cannot OTA onto the bigger layout
#     — the first install with this package must be over serial. (An OTA of a
#     too-big image just fails to fit the old slot; it won't resize anything.)
#   * Run `esptool.py erase_flash` before that serial flash to clear stale
#     otadata/nvs that reference the old offsets.
#   * The device must physically have >= 16MB flash (esptool.py flash_id).
# After that single serial flash, normal OTA resumes within the larger slots.
#
# Prefer slimming first (compose core + only the pages you use): if that keeps
# you under 1.75MB you stay fully OTA-updatable and never need this.

esp32:
  flash_size: 16MB
