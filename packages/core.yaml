# core.yaml — Common, page-independent panel scaffolding.
#
# Bundles everything a panel needs EXCEPT the UI pages: board hardware,
# navigation, sleep mode, connectivity, and the device/framework setup. UI
# pages are added by the consumer so a device only compiles the pages it
# actually uses — every unused page is otherwise dead weight in flash.
#
# Full bundle (all five pages):
#   packages:
#     panel: {url: ..., file: esp32-hass-panel.yaml}
#
# Slim (pick only the pages you want — smaller image):
#   packages:
#     core:    {url: ..., file: packages/core.yaml}
#     area_ui: {url: ..., file: packages/area-ui.yaml}
#
# When composing slim, every active nav_page_N must point at a page that one
# of your included UI packages defines. You only need to set as many nav_page_N
# as you have active pages — unused slots default to ${nav_page_1}, so they
# always resolve to a compiled page (see tests/area-panel.yaml).

substitutions:
  name: esp32-hass-panel
  friendly_name: ESP32 Home Panel
  # Flash / OTA partition layout. Default "4MB" → ~1.75MB per OTA app slot,
  # fully OTA-friendly. Override to "16MB" on a >=16MB device whose firmware
  # has outgrown that slot → ESPHome auto-sizes ~7.75MB app slots. NOTE: a
  # partition-table change only takes effect via a one-time USB-serial flash
  # (OTA never rewrites the partition table); erase_flash first.
  flash_size: "4MB"

packages:
  board: !include board.yaml
  nav: !include nav.yaml
  sleep_mode: !include sleep-mode.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # project.version is the single source of truth for the firmware version
  # shown on the connecting overlay (via ESPHOME_PROJECT_VERSION) and in the
  # HA Dashboard / OTA metadata. Bumped automatically by release-please on
  # each release — do not edit by hand.
  project:
    name: "HomeOps.esphome-hass-panels"
    version: "2.3.0" # x-release-please-version

# Switched from arduino to esp-idf — required for RGB panel + LVGL
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: ${flash_size}
  framework:
    type: esp-idf

# 8MB octal PSRAM required for LVGL frame buffer
psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      # Prevent display flickering during OTA flash
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password

captive_portal:

# LVGL top-level settings — rotation is board-specific; pages are
# contributed by the UI packages the consumer includes.
lvgl:
  rotation: ${display_rotation}
