# Area UI — one LVGL page that controls a whole Home Assistant *area* by
# acting on a single entity per device kind.
#
# ESPHome's `homeassistant` platform binds to explicit entity_ids at compile
# time — it can't enumerate an area's members. So instead of one row per
# entity, each kind binds ONE entity and lets Home Assistant fan the command
# out. That entity can be either:
#   • a group (Settings → Devices & Services → Helpers → Group →
#     Light/Switch/Cover/Lock) — toggling it acts on every member, and its
#     state is the aggregate ("on" if ANY member is on); or
#   • a single device entity (e.g. `light.kitchen_ceiling`) — works exactly
#     the same, it just happens to have one member.
#
# Kinds:
#   light.<…>    — Lights   (MANDATORY — always shown)
#   switch.<…>   — Switches (optional)
#   cover.<…>    — Covers   (optional, open/stop/close)
#   lock.<…>     — Locks    (optional, lock/unlock)
#   sensor.<…>   — Temperature + Humidity readouts (optional)
#
# Optional kinds are HIDDEN unless configured. "Not configured" = the
# substitution is left at its sentinel default (`<domain>.none`); the card
# then collapses out of the FLEX column so the remaining cards reflow up.
# To hide a kind you previously set, point it back at `<domain>.none`.
#
# Alternative to groups: every action can instead target an area directly by
# replacing `entity_id: ${…}` with `area_id: <your_area_id>` in the
# homeassistant.service calls below — HA resolves the area to its members.
# A group entity is used by default because it also exposes the aggregate
# state needed to render each toggle, which a bare area_id cannot.
#
# Layout (480×480 display, nav_bar_height=60): a vertical FLEX column below
# the navbar — area name, then the climate row and each configured card,
# top-aligned and reflowing as sections are shown/hidden at boot.
#
# Navbar contract (nav.yaml):
#   Writes "<Area>  <temp>° <hum>%" to any nav slot mapped to area_page,
#   then calls nav_refresh_status (climate parts omitted when unset).

substitutions:
  # Friendly label shown at the top of the page and in the navbar.
  area_name: "Living Room"
  # Lights — MANDATORY. A real light group or single light entity.
  area_lights_entity_id: light.living_room
  # Optional kinds — leave at the `<domain>.none` sentinel to hide the card.
  area_switches_entity_id: switch.none
  area_covers_entity_id: cover.none
  area_locks_entity_id: lock.none
  area_temp_entity_id: sensor.none
  area_humidity_entity_id: sensor.none

globals:
  # Latest climate readouts + "have we seen a value yet" flags, so the
  # navbar status line can omit a reading that never arrived.
  - id: g_area_temp
    type: float
    restore_value: no
    initial_value: '0'
  - id: g_area_hum
    type: float
    restore_value: no
    initial_value: '0'
  - id: g_area_temp_known
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_area_hum_known
    type: bool
    restore_value: no
    initial_value: 'false'
  # Light capabilities, parsed from the group's supported_color_modes. Gate
  # which controls the popup shows: dimmable → brightness slider, color →
  # colour swatches. Both false (onoff-only light) → tapping the card is a
  # no-op (the on/off button still works).
  - id: g_area_lights_dimmable
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_area_lights_color
    type: bool
    restore_value: no
    initial_value: 'false'

sensor:
  - platform: homeassistant
    id: area_temp
    entity_id: ${area_temp_entity_id}
    on_value:
      - lambda: |-
          id(g_area_temp) = x;
          id(g_area_temp_known) = true;
      - lvgl.label.update:
          id: lbl_area_temp
          text: !lambda return str_sprintf("%.1f°", x);
      - script.execute: area_refresh_nav

  - platform: homeassistant
    id: area_humidity
    entity_id: ${area_humidity_entity_id}
    on_value:
      - lambda: |-
          id(g_area_hum) = x;
          id(g_area_hum_known) = true;
      - lvgl.label.update:
          id: lbl_area_hum
          text: !lambda return str_sprintf("%.0f%%", x);
      - script.execute: area_refresh_nav

  # Group brightness (0-255) → drives the popup slider position + % label.
  # Programmatic updates only fire the slider's on_value (live %), never its
  # on_release, so syncing from HA can't loop back into a service call.
  - platform: homeassistant
    id: area_lights_brightness
    entity_id: ${area_lights_entity_id}
    attribute: brightness
    on_value:
      - lvgl.slider.update:
          id: slider_area_brightness
          value: !lambda 'return (int) roundf(x / 255.0f * 100.0f);'
      - lvgl.label.update:
          id: lbl_area_brightness_pct
          text: !lambda 'return str_sprintf("%d%%", (int) roundf(x / 255.0f * 100.0f));'

text_sensor:
  # Lights group state — drives the Lights toggle label/colour. Also the
  # page's "first HA state" signal that flips nav.yaml's Permissions step.
  - platform: homeassistant
    id: area_lights_state
    entity_id: ${area_lights_entity_id}
    on_value:
      - if:
          condition:
            lambda: 'return !id(g_perms_ok);'
          then:
            - lambda: id(g_perms_ok) = true;
            - script.execute: nav_connection_check
      - lvgl.label.update:
          id: lbl_area_lights_state
          text: !lambda 'return std::string(x == "on" ? "ON" : "OFF");'
          text_color: !lambda 'return lv_color_hex(x == "on" ? 0x66dd66 : 0x888888);'
      # Keep the popup's on/off button in sync with the card's.
      - lvgl.label.update:
          id: lbl_popup_lights_state
          text: !lambda 'return std::string(x == "on" ? "ON" : "OFF");'
          text_color: !lambda 'return lv_color_hex(x == "on" ? 0x66dd66 : 0x888888);'

  # Light capabilities — supported_color_modes is a list like "['brightness']"
  # or "['color_temp', 'hs']". Substring-match the modes that imply brightness
  # / colour, store the result, and (re)apply the popup section visibility.
  - platform: homeassistant
    id: area_lights_color_modes
    entity_id: ${area_lights_entity_id}
    attribute: supported_color_modes
    on_value:
      - lambda: |-
          std::string m = x;
          id(g_area_lights_color) =
              m.find("hs")  != std::string::npos ||
              m.find("rgb") != std::string::npos ||
              m.find("xy")  != std::string::npos;
          // Any mode other than plain on/off carries a brightness channel.
          id(g_area_lights_dimmable) =
              id(g_area_lights_color) ||
              m.find("brightness") != std::string::npos ||
              m.find("color_temp") != std::string::npos ||
              m.find("white")      != std::string::npos;
      - script.execute: area_light_popup_apply_caps

  - platform: homeassistant
    id: area_switches_state
    entity_id: ${area_switches_entity_id}
    on_value:
      - lvgl.label.update:
          id: lbl_area_switches_state
          text: !lambda 'return std::string(x == "on" ? "ON" : "OFF");'
          text_color: !lambda 'return lv_color_hex(x == "on" ? 0x66dd66 : 0x888888);'

  # Cover group state — colours the Covers icon to signal motion/position.
  - platform: homeassistant
    id: area_covers_state
    entity_id: ${area_covers_entity_id}
    on_value:
      - lvgl.label.update:
          id: lbl_area_covers_icon
          text_color: !lambda |-
            if (x == "open")                      return lv_color_hex(0xffaa33);
            if (x == "opening" || x == "closing") return lv_color_hex(0x66aaff);
            if (x == "closed")                    return lv_color_hex(0x888888);
            return lv_color_hex(0xcccccc);

  # Lock group state — drives the Locks toggle label/icon/colour.
  - platform: homeassistant
    id: area_locks_state
    entity_id: ${area_locks_entity_id}
    on_value:
      - lvgl.label.update:
          id: lbl_area_locks_state
          text: !lambda 'return std::string(x == "locked" ? "LOCKED" : "UNLOCKED");'
          text_color: !lambda 'return lv_color_hex(x == "locked" ? 0x66dd66 : 0xe94560);'
      - lvgl.label.update:
          id: lbl_area_locks_icon
          text: !lambda 'return std::string(x == "locked" ? "\U000F033E" : "\U000F033F");'
          text_color: !lambda 'return lv_color_hex(x == "locked" ? 0x66dd66 : 0xe94560);'

script:
  # Build the navbar status line from whatever readings have arrived and
  # route it to the nav slot(s) mapped to area_page (same strcmp pattern
  # as the other UI packages).
  - id: area_refresh_nav
    then:
      - lambda: |-
          char buf[64];
          int n = snprintf(buf, sizeof(buf), "%s", "${area_name}");
          if (id(g_area_temp_known))
            n += snprintf(buf + n, sizeof(buf) - n, "  %.1f°", id(g_area_temp));
          if (id(g_area_hum_known))
            n += snprintf(buf + n, sizeof(buf) - n, " %.0f%%", id(g_area_hum));
          if (strcmp("${nav_page_1}", "area_page") == 0) id(g_nav_status_0) = buf;
          if (strcmp("${nav_page_2}", "area_page") == 0) id(g_nav_status_1) = buf;
          if (strcmp("${nav_page_3}", "area_page") == 0) id(g_nav_status_2) = buf;
          if (strcmp("${nav_page_4}", "area_page") == 0) id(g_nav_status_3) = buf;
      - script.execute: nav_refresh_status

  # Show/hide each optional card based on whether its entity is configured
  # (i.e. not the `<domain>.none` sentinel). Hidden FLEX children collapse,
  # so the remaining cards reflow up the column. Run once at boot.
  - id: area_apply_visibility
    then:
      # Switches
      - if:
          condition: {lambda: 'return strcmp("${area_switches_entity_id}", "switch.none") == 0;'}
          then: [{lvgl.widget.hide: card_area_switches}]
          else: [{lvgl.widget.show: card_area_switches}]
      # Covers
      - if:
          condition: {lambda: 'return strcmp("${area_covers_entity_id}", "cover.none") == 0;'}
          then: [{lvgl.widget.hide: card_area_covers}]
          else: [{lvgl.widget.show: card_area_covers}]
      # Locks
      - if:
          condition: {lambda: 'return strcmp("${area_locks_entity_id}", "lock.none") == 0;'}
          then: [{lvgl.widget.hide: card_area_locks}]
          else: [{lvgl.widget.show: card_area_locks}]
      # Temperature half of the climate row
      - if:
          condition: {lambda: 'return strcmp("${area_temp_entity_id}", "sensor.none") == 0;'}
          then: [{lvgl.widget.hide: grp_area_temp}]
          else: [{lvgl.widget.show: grp_area_temp}]
      # Humidity half of the climate row
      - if:
          condition: {lambda: 'return strcmp("${area_humidity_entity_id}", "sensor.none") == 0;'}
          then: [{lvgl.widget.hide: grp_area_hum}]
          else: [{lvgl.widget.show: grp_area_hum}]
      # Whole climate row — hidden only when BOTH temp and humidity are unset.
      - if:
          condition:
            lambda: |-
              return strcmp("${area_temp_entity_id}", "sensor.none") == 0 &&
                     strcmp("${area_humidity_entity_id}", "sensor.none") == 0;
          then: [{lvgl.widget.hide: card_area_climate}]
          else: [{lvgl.widget.show: card_area_climate}]

  # Group actions — call the service on the configured entity; HA fans it
  # out to every member of the group (or area / single device).
  #
  # Each script logs at the moment of the press (before the service call) so
  # the device log distinguishes "button never fired" (no log) from "command
  # sent but HA dropped it" (log present, but nothing happens in HA — check
  # the per-device "Allow the device to perform Home Assistant actions"
  # setting and HA's own log). Lights/switches resolve on/off explicitly from
  # the current group state rather than using `toggle`, which is ambiguous
  # on a group whose members disagree.
  - id: area_lights_toggle
    then:
      - if:
          condition:
            lambda: 'return id(area_lights_state).state == "on";'
          then:
            - logger.log: "Area lights: sending light.turn_off"
            - homeassistant.service:
                service: light.turn_off
                data:
                  entity_id: ${area_lights_entity_id}
          else:
            - logger.log: "Area lights: sending light.turn_on"
            - homeassistant.service:
                service: light.turn_on
                data:
                  entity_id: ${area_lights_entity_id}

  - id: area_switches_toggle
    then:
      - if:
          condition:
            lambda: 'return id(area_switches_state).state == "on";'
          then:
            - logger.log: "Area switches: sending switch.turn_off"
            - homeassistant.service:
                service: switch.turn_off
                data:
                  entity_id: ${area_switches_entity_id}
          else:
            - logger.log: "Area switches: sending switch.turn_on"
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: ${area_switches_entity_id}

  - id: area_covers_open
    then:
      - logger.log: "Area covers: sending cover.open_cover"
      - homeassistant.service:
          service: cover.open_cover
          data:
            entity_id: ${area_covers_entity_id}

  - id: area_covers_stop
    then:
      - logger.log: "Area covers: sending cover.stop_cover"
      - homeassistant.service:
          service: cover.stop_cover
          data:
            entity_id: ${area_covers_entity_id}

  - id: area_covers_close
    then:
      - logger.log: "Area covers: sending cover.close_cover"
      - homeassistant.service:
          service: cover.close_cover
          data:
            entity_id: ${area_covers_entity_id}

  # Locks have no universal toggle service — branch on the current group
  # state and call lock/unlock explicitly.
  - id: area_locks_toggle
    then:
      - if:
          condition:
            lambda: 'return id(area_locks_state).state == "locked";'
          then:
            - logger.log: "Area locks: sending lock.unlock"
            - homeassistant.service:
                service: lock.unlock
                data:
                  entity_id: ${area_locks_entity_id}
          else:
            - logger.log: "Area locks: sending lock.lock"
            - homeassistant.service:
                service: lock.lock
                data:
                  entity_id: ${area_locks_entity_id}

  # ── Lights popup (brightness + colour) ──────────────────────────────
  # Show/hide the popup's brightness and colour sections from the parsed
  # capabilities. Called when capabilities arrive and on every open, so a
  # late supported_color_modes update still lands correctly.
  - id: area_light_popup_apply_caps
    then:
      - if:
          condition: {lambda: 'return id(g_area_lights_dimmable);'}
          then: [{lvgl.widget.show: grp_popup_brightness}]
          else: [{lvgl.widget.hide: grp_popup_brightness}]
      - if:
          condition: {lambda: 'return id(g_area_lights_color);'}
          then: [{lvgl.widget.show: grp_popup_color}]
          else: [{lvgl.widget.hide: grp_popup_color}]

  # Open only when there is something to adjust (dimmable or colour); an
  # onoff-only light has no popup — the card's on/off button is enough.
  - id: area_light_popup_open
    then:
      - if:
          condition:
            lambda: 'return id(g_area_lights_dimmable) || id(g_area_lights_color);'
          then:
            - script.execute: area_light_popup_apply_caps
            - lvgl.widget.show: area_light_popup

  - id: area_light_popup_close
    then:
      - lvgl.widget.hide: area_light_popup

  # Send an RGB colour. HA can't take a list through plain `data:` (values
  # arrive as strings), so render it as a `data_template` — HA parses the
  # rendered "[r, g, b]" back into a real list (native-type templating).
  - id: area_set_color
    parameters:
      r: int
      g: int
      b: int
    then:
      - logger.log:
          format: "Area lights: sending light.turn_on rgb_color [%d, %d, %d]"
          args: [r, g, b]
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: ${area_lights_entity_id}
          data_template:
            rgb_color: "[{{ r }}, {{ g }}, {{ b }}]"
          variables:
            r: !lambda 'return r;'
            g: !lambda 'return g;'
            b: !lambda 'return b;'

# Apply card visibility once LVGL is up (priority -100, like nav/sleep-mode).
esphome:
  on_boot:
    priority: -100
    then:
      - script.execute: area_apply_visibility

font:
  # Card icons + cover arrows. Separate id per package so glyph sets don't
  # cross-couple (matches mdi_icons_garage / mdi_icons_energy convention).
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons_area
    size: 30
    glyphs:
      - "\U000F0335"  # mdi:lightbulb       → Lights
      - "\U000F0521"  # mdi:toggle-switch   → Switches
      - "\U000F00AC"  # mdi:blinds          → Covers
      - "\U000F033E"  # mdi:lock            → Locks (locked)
      - "\U000F033F"  # mdi:lock-open       → Locks (unlocked)
      - "\U000F050F"  # mdi:thermometer     → temperature
      - "\U000F058E"  # mdi:water-percent   → humidity
      - "\U000F0737"  # mdi:arrow-up-bold   → cover open
      - "\U000F04DB"  # mdi:stop            → cover stop
      - "\U000F072E"  # mdi:arrow-down-bold → cover close

lvgl:
  pages:
    - id: area_page
      widgets:
        - obj:
            id: area_page_root
            width: ${display_width}
            height: ${display_height}
            bg_color: 0x1a1a2e
            border_width: 0
            pad_top: 68
            pad_bottom: 12
            pad_left: 20
            pad_right: 20
            scrollbar_mode: "off"
            scrollable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER
              pad_row: 8
            widgets:

              # ── Area name ─────────────────────────────────────────
              - label:
                  id: lbl_area_name
                  width: 440
                  height: 32
                  text: "${area_name}"
                  long_mode: DOT
                  text_align: CENTER
                  text_font: montserrat_28
                  text_color: 0xffffff

              # ── Climate row (temp · humidity) ─────────────────────
              - obj:
                  id: card_area_climate
                  width: 440
                  height: 56
                  bg_color: 0x16213e
                  border_width: 0
                  radius: 12
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_EVENLY
                    flex_align_cross: CENTER
                  widgets:
                    - obj:
                        id: grp_area_temp
                        width: 170
                        height: 44
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "off"
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: CENTER
                          flex_align_cross: CENTER
                          pad_column: 8
                        widgets:
                          - label:
                              text: "\U000F050F"  # mdi:thermometer
                              text_font: mdi_icons_area
                              text_color: 0xe94560
                          - label:
                              id: lbl_area_temp
                              text: "--°"
                              text_font: montserrat_28
                              text_color: 0xffffff
                    - obj:
                        id: grp_area_hum
                        width: 170
                        height: 44
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "off"
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: CENTER
                          flex_align_cross: CENTER
                          pad_column: 8
                        widgets:
                          - label:
                              text: "\U000F058E"  # mdi:water-percent
                              text_font: mdi_icons_area
                              text_color: 0x66aaff
                          - label:
                              id: lbl_area_hum
                              text: "--%"
                              text_font: montserrat_28
                              text_color: 0xffffff

              # ── Lights group (mandatory) ──────────────────────────
              # The card body is clickable: tapping anywhere except the
              # on/off button opens the brightness/colour popup. The button
              # is a clickable child, so it captures its own taps (LVGL hit-
              # testing) and never opens the popup; taps on the icon/label/
              # empty area fall through to the card's on_click.
              - obj:
                  id: card_area_lights
                  width: 440
                  height: 63
                  bg_color: 0x16213e
                  border_width: 0
                  radius: 12
                  pad_left: 18
                  pad_right: 12
                  pad_top: 0
                  pad_bottom: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  clickable: true
                  on_click:
                    - script.execute: area_light_popup_open
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: START
                    flex_align_cross: CENTER
                    pad_column: 14
                  widgets:
                    - label:
                        text: "\U000F0335"  # mdi:lightbulb
                        text_font: mdi_icons_area
                        text_color: 0xffcf66
                    - label:
                        flex_grow: 1
                        text: "Lights"
                        text_font: montserrat_22
                        text_color: 0xffffff
                    - button:
                        width: 110
                        height: 48
                        bg_color: 0x0f3460
                        on_press:
                          - script.execute: area_lights_toggle
                        widgets:
                          - label:
                              id: lbl_area_lights_state
                              align: CENTER
                              text: "--"
                              text_font: montserrat_22
                              text_color: 0x888888

              # ── Switches group (optional) ─────────────────────────
              - obj:
                  id: card_area_switches
                  width: 440
                  height: 63
                  bg_color: 0x16213e
                  border_width: 0
                  radius: 12
                  pad_left: 18
                  pad_right: 12
                  pad_top: 0
                  pad_bottom: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  hidden: true
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: START
                    flex_align_cross: CENTER
                    pad_column: 14
                  widgets:
                    - label:
                        text: "\U000F0521"  # mdi:toggle-switch
                        text_font: mdi_icons_area
                        text_color: 0xcccccc
                    - label:
                        flex_grow: 1
                        text: "Switches"
                        text_font: montserrat_22
                        text_color: 0xffffff
                    - button:
                        width: 110
                        height: 48
                        bg_color: 0x0f3460
                        on_press:
                          - script.execute: area_switches_toggle
                        widgets:
                          - label:
                              id: lbl_area_switches_state
                              align: CENTER
                              text: "--"
                              text_font: montserrat_22
                              text_color: 0x888888

              # ── Covers group (optional) ───────────────────────────
              - obj:
                  id: card_area_covers
                  width: 440
                  height: 79
                  bg_color: 0x16213e
                  border_width: 0
                  radius: 12
                  pad_left: 18
                  pad_right: 12
                  pad_top: 0
                  pad_bottom: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  hidden: true
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: START
                    flex_align_cross: CENTER
                    pad_column: 10
                  widgets:
                    - label:
                        id: lbl_area_covers_icon
                        text: "\U000F00AC"  # mdi:blinds
                        text_font: mdi_icons_area
                        text_color: 0xcccccc
                    - label:
                        flex_grow: 1
                        text: "Covers"
                        text_font: montserrat_22
                        text_color: 0xffffff
                    - button:
                        width: 56
                        height: 60
                        bg_color: 0x0b8457
                        on_press:
                          - script.execute: area_covers_open
                        widgets:
                          - label:
                              align: CENTER
                              text: "\U000F0737"  # mdi:arrow-up-bold
                              text_font: mdi_icons_area
                              text_color: 0xffffff
                    - button:
                        width: 56
                        height: 60
                        bg_color: 0x888888
                        on_press:
                          - script.execute: area_covers_stop
                        widgets:
                          - label:
                              align: CENTER
                              text: "\U000F04DB"  # mdi:stop
                              text_font: mdi_icons_area
                              text_color: 0xffffff
                    - button:
                        width: 56
                        height: 60
                        bg_color: 0xe94560
                        on_press:
                          - script.execute: area_covers_close
                        widgets:
                          - label:
                              align: CENTER
                              text: "\U000F072E"  # mdi:arrow-down-bold
                              text_font: mdi_icons_area
                              text_color: 0xffffff

              # ── Locks group (optional) ────────────────────────────
              - obj:
                  id: card_area_locks
                  width: 440
                  height: 63
                  bg_color: 0x16213e
                  border_width: 0
                  radius: 12
                  pad_left: 18
                  pad_right: 12
                  pad_top: 0
                  pad_bottom: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  hidden: true
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: START
                    flex_align_cross: CENTER
                    pad_column: 14
                  widgets:
                    - label:
                        id: lbl_area_locks_icon
                        text: "\U000F033E"  # mdi:lock
                        text_font: mdi_icons_area
                        text_color: 0xcccccc
                    - label:
                        flex_grow: 1
                        text: "Locks"
                        text_font: montserrat_22
                        text_color: 0xffffff
                    - button:
                        width: 130
                        height: 48
                        bg_color: 0x0f3460
                        on_press:
                          - script.execute: area_locks_toggle
                        widgets:
                          - label:
                              id: lbl_area_locks_state
                              align: CENTER
                              text: "--"
                              text_font: montserrat_18
                              text_color: 0x888888

        # ── Lights popup: on/off + brightness + colour ────────────────
        # Sibling of area_page_root (NOT inside the FLEX column), so it's a
        # free-positioned overlay. Hidden until the Lights card is tapped.
        # The full-screen backdrop is clickable → tap outside the card to
        # dismiss. Brightness/colour sections are shown per capability.
        - obj:
            id: area_light_popup
            x: 0
            y: 0
            width: ${display_width}
            height: ${display_height}
            bg_color: 0x000000
            bg_opa: 70%
            border_width: 0
            radius: 0
            pad_all: 0
            scrollbar_mode: "off"
            scrollable: false
            clickable: true
            hidden: true
            on_click:
              - script.execute: area_light_popup_close
            widgets:
              # Centred control card. clickable:true makes it a tap sink so
              # taps inside the card don't fall through to the backdrop and
              # close the popup.
              - obj:
                  id: area_light_popup_card
                  align: CENTER
                  y: 18
                  width: 400
                  height: SIZE_CONTENT
                  bg_color: 0x16213e
                  border_width: 0
                  radius: 16
                  pad_all: 16
                  scrollbar_mode: "off"
                  scrollable: false
                  clickable: true
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: START
                    flex_align_cross: CENTER
                    pad_row: 14
                  widgets:
                    - label:
                        text: "${area_name} Lights"
                        text_font: montserrat_22
                        text_color: 0xffffff

                    # On/off row (always shown)
                    - obj:
                        width: 360
                        height: 48
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "off"
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_BETWEEN
                          flex_align_cross: CENTER
                        widgets:
                          - label:
                              text: "Power"
                              text_font: montserrat_18
                              text_color: 0xcccccc
                          - button:
                              width: 120
                              height: 48
                              bg_color: 0x0f3460
                              on_press:
                                - script.execute: area_lights_toggle
                              widgets:
                                - label:
                                    id: lbl_popup_lights_state
                                    align: CENTER
                                    text: "--"
                                    text_font: montserrat_22
                                    text_color: 0x888888

                    # Brightness section (shown when dimmable)
                    - obj:
                        id: grp_popup_brightness
                        width: 360
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "off"
                        scrollable: false
                        hidden: true
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_main: START
                          flex_align_cross: START
                          pad_row: 6
                        widgets:
                          - obj:
                              width: 360
                              height: 22
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "off"
                              scrollable: false
                              layout:
                                type: FLEX
                                flex_flow: ROW
                                flex_align_main: SPACE_BETWEEN
                                flex_align_cross: CENTER
                              widgets:
                                - label:
                                    text: "Brightness"
                                    text_font: montserrat_18
                                    text_color: 0xcccccc
                                - label:
                                    id: lbl_area_brightness_pct
                                    text: "--%"
                                    text_font: montserrat_18
                                    text_color: 0xffffff
                          - slider:
                              id: slider_area_brightness
                              width: 360
                              height: 18
                              min_value: 0
                              max_value: 100
                              value: 0
                              on_value:
                                - lvgl.label.update:
                                    id: lbl_area_brightness_pct
                                    text: !lambda 'return str_sprintf("%d%%", (int) x);'
                              on_release:
                                - logger.log: "Area lights: sending light.turn_on brightness_pct"
                                - homeassistant.service:
                                    service: light.turn_on
                                    data:
                                      entity_id: ${area_lights_entity_id}
                                    data_template:
                                      brightness_pct: "{{ p }}"
                                    variables:
                                      p: !lambda 'return (int) lv_slider_get_value(id(slider_area_brightness));'

                    # Colour swatches section (shown when colour-capable)
                    - obj:
                        id: grp_popup_color
                        width: 360
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "off"
                        scrollable: false
                        hidden: true
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_main: START
                          flex_align_cross: START
                          pad_row: 6
                        widgets:
                          - label:
                              text: "Color"
                              text_font: montserrat_18
                              text_color: 0xcccccc
                          - obj:
                              width: 360
                              height: SIZE_CONTENT
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "off"
                              scrollable: false
                              layout:
                                type: FLEX
                                flex_flow: ROW_WRAP
                                flex_align_main: SPACE_BETWEEN
                                flex_align_cross: CENTER
                                pad_row: 8
                                pad_column: 8
                              widgets:
                                - button:
                                    width: 80
                                    height: 40
                                    bg_color: 0xe53935
                                    radius: 8
                                    on_press:
                                      - script.execute: {id: area_set_color, r: 255, g: 0, b: 0}
                                - button:
                                    width: 80
                                    height: 40
                                    bg_color: 0xfb8c00
                                    radius: 8
                                    on_press:
                                      - script.execute: {id: area_set_color, r: 255, g: 140, b: 0}
                                - button:
                                    width: 80
                                    height: 40
                                    bg_color: 0xfdd835
                                    radius: 8
                                    on_press:
                                      - script.execute: {id: area_set_color, r: 255, g: 220, b: 0}
                                - button:
                                    width: 80
                                    height: 40
                                    bg_color: 0x43a047
                                    radius: 8
                                    on_press:
                                      - script.execute: {id: area_set_color, r: 0, g: 200, b: 0}
                                - button:
                                    width: 80
                                    height: 40
                                    bg_color: 0x00acc1
                                    radius: 8
                                    on_press:
                                      - script.execute: {id: area_set_color, r: 0, g: 200, b: 200}
                                - button:
                                    width: 80
                                    height: 40
                                    bg_color: 0x1e88e5
                                    radius: 8
                                    on_press:
                                      - script.execute: {id: area_set_color, r: 30, g: 120, b: 255}
                                - button:
                                    width: 80
                                    height: 40
                                    bg_color: 0x8e24aa
                                    radius: 8
                                    on_press:
                                      - script.execute: {id: area_set_color, r: 160, g: 30, b: 220}
                                - button:
                                    width: 80
                                    height: 40
                                    bg_color: 0xffffff
                                    radius: 8
                                    on_press:
                                      - script.execute: {id: area_set_color, r: 255, g: 255, b: 255}

                    # Close
                    - button:
                        width: 360
                        height: 48
                        bg_color: 0x0f3460
                        on_press:
                          - script.execute: area_light_popup_close
                        widgets:
                          - label:
                              align: CENTER
                              text: "Done"
                              text_font: montserrat_22
                              text_color: 0xffffff
