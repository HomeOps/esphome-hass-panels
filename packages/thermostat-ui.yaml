# Thermostat UI — LVGL interface wired to Home Assistant climate entity
# Board-independent; include alongside board.yaml and alarm-keypad-ui.yaml.
#
# Layout (480×480 display, nav_bar_height=60):
#   y=  0..59  — navbar (top_layer, handled by nav.yaml)
#   y= 65..120 — current temperature (large)
#   y=122..139 — "CURRENT" sub-label
#   y=145..214 — setpoint row  [-]  XX.X°  [+]
#   y=220..280 — HVAC mode dropdown
#   y=290..350 — preset dropdown (hidden when the entity has no presets)
#   Remaining space available for future features
#
# The MODE and PRESET dropdowns adapt to the entity's advertised capabilities
# (hvac_modes / preset_modes): unsupported HVAC modes (heat, cool, fan_only, …)
# are dropped from the list and the whole PRESET section is hidden when the
# entity exposes no presets — the UI never offers a capability the device lacks.

substitutions:
  # HA climate entity + setpoint range this page controls. Self-defaulted so
  # the package is usable standalone (slim composition), like the other UI
  # packages. Override per device when needed.
  thermostat_entity_id: climate.thermostat
  thermostat_temp_min: "16.0"
  thermostat_temp_max: "30.0"
  thermostat_temp_step: "0.5"

globals:
  - id: target_temp
    type: float
    restore_value: no
    initial_value: '22.0'

  # Capabilities advertised by the HA climate entity, learned at runtime from
  # its hvac_modes / preset_modes attributes. These drive which options the
  # dropdowns present and map a dropdown index back to the HA mode/preset
  # string, so the UI only ever offers what the device actually supports.
  - id: g_hvac_modes
    type: std::vector<std::string>
    restore_value: no
  - id: g_preset_modes
    type: std::vector<std::string>
    restore_value: no

esphome:
  # priority -100 → runs after LVGL is up (matches nav/sleep-mode/area).
  on_boot:
    priority: -100
    then:
      # Seed the HVAC mode map to match the dropdown's static option order so
      # mode selection works before HA reports hvac_modes (a climate entity
      # always advertises hvac_modes, so this is refined on connect). Presets
      # start empty + hidden: unless the entity advertises preset_modes, the
      # PRESET section is never shown.
      - lambda: |-
          id(g_hvac_modes) = {"off", "heat", "cool", "auto", "fan_only"};
      - lvgl.widget.hide: dd_preset_mode
      - lvgl.widget.hide: lbl_preset_heading

sensor:
  - platform: homeassistant
    id: clim_current_temp
    entity_id: ${thermostat_entity_id}
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_current_temp
          text: !lambda return str_sprintf("%.1f°", x);
      - lambda: |-
          std::string preset = id(clim_preset_mode).state;
          if (preset.empty()) preset = "--";
          char buf[64];
          snprintf(buf, sizeof(buf), "%s - %.1f C", preset.c_str(), x);
          if (strcmp("${nav_page_1}", "thermostat_page") == 0) id(g_nav_status_0) = buf;
          if (strcmp("${nav_page_2}", "thermostat_page") == 0) id(g_nav_status_1) = buf;
          if (strcmp("${nav_page_3}", "thermostat_page") == 0) id(g_nav_status_2) = buf;
          if (strcmp("${nav_page_4}", "thermostat_page") == 0) id(g_nav_status_3) = buf;
      - script.execute: nav_refresh_status

  - platform: homeassistant
    id: clim_target_temp_sensor
    entity_id: ${thermostat_entity_id}
    attribute: temperature
    on_value:
      - lambda: id(target_temp) = x;
      - lvgl.label.update:
          id: lbl_target_temp
          text: !lambda return str_sprintf("%.1f°", x);

text_sensor:
  - platform: homeassistant
    id: clim_hvac_mode
    entity_id: ${thermostat_entity_id}
    on_value:
      # Select the entry matching the current mode within the dynamically-built
      # option list (g_hvac_modes). Accept both "auto" and "heat_cool" — some HA
      # integrations expose the dual-setpoint mode under either name, but the UI
      # only ever offers it as "auto".
      - lvgl.dropdown.update:
          id: dd_hvac_mode
          selected_index: !lambda |-
            auto &modes = id(g_hvac_modes);
            for (size_t i = 0; i < modes.size(); i++) {
              if (modes[i] == x || (modes[i] == "auto" && x == "heat_cool"))
                return (int) i;
            }
            return 0;

  - platform: homeassistant
    id: clim_preset_mode
    entity_id: ${thermostat_entity_id}
    attribute: preset_mode
    on_value:
      - lambda: |-
          char buf[64];
          snprintf(buf, sizeof(buf), "%s - %.1f C", x.c_str(), id(clim_current_temp).state);
          if (strcmp("${nav_page_1}", "thermostat_page") == 0) id(g_nav_status_0) = buf;
          if (strcmp("${nav_page_2}", "thermostat_page") == 0) id(g_nav_status_1) = buf;
          if (strcmp("${nav_page_3}", "thermostat_page") == 0) id(g_nav_status_2) = buf;
          if (strcmp("${nav_page_4}", "thermostat_page") == 0) id(g_nav_status_3) = buf;
      - script.execute: nav_refresh_status
      - lvgl.dropdown.update:
          id: dd_preset_mode
          selected_index: !lambda |-
            auto &presets = id(g_preset_modes);
            for (size_t i = 0; i < presets.size(); i++) {
              if (presets[i] == x) return (int) i;
            }
            return 0;

  # ── Capability discovery ────────────────────────────────────────────
  # HA advertises which HVAC modes / presets an entity supports via its
  # hvac_modes and preset_modes list attributes. We rebuild the dropdowns
  # from those lists so the UI only presents capabilities the device has:
  # no heat mode → no "Heat"; no fan_only → no "Fan Only"; no presets → the
  # whole PRESET section is hidden.
  - platform: homeassistant
    id: clim_hvac_modes
    entity_id: ${thermostat_entity_id}
    attribute: hvac_modes
    on_value:
      - lambda: |-
          // hvac_modes arrives as a stringified Python list. Depending on the
          // HA version the entries may be clean ('cool') or enum reprs
          // (<HVACMode.COOL: 'cool'>), so match each mode name as a whole word
          // (bounded by non-identifier chars) rather than tokenising. The '_'
          // boundary also stops "heat" matching inside "heat_cool".
          std::string raw = x;
          ESP_LOGD("thermostat", "hvac_modes raw='%s'", raw.c_str());
          auto is_ident = [](char c) {
            return (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') ||
                   (c >= '0' && c <= '9') || c == '_';
          };
          auto has = [&](const std::string &m) {
            for (size_t p = 0; (p = raw.find(m, p)) != std::string::npos; p += m.size()) {
              bool left  = (p == 0) || !is_ident(raw[p - 1]);
              bool right = (p + m.size() >= raw.size()) || !is_ident(raw[p + m.size()]);
              if (left && right) return true;
            }
            return false;
          };
          // Build the option list in a stable display order, keeping only
          // supported modes. g_hvac_modes maps dropdown index → HA mode string.
          std::vector<std::string> modes, labels;
          if (has("off"))      { modes.push_back("off");      labels.push_back("Off"); }
          if (has("heat"))     { modes.push_back("heat");     labels.push_back("Heat"); }
          if (has("cool"))     { modes.push_back("cool");     labels.push_back("Cool"); }
          if (has("auto") || has("heat_cool")) { modes.push_back("auto"); labels.push_back("Auto"); }
          if (has("fan_only")) { modes.push_back("fan_only"); labels.push_back("Fan Only"); }
          if (labels.empty())  { modes.push_back("off");      labels.push_back("Off"); }
          id(g_hvac_modes) = modes;
          id(dd_hvac_mode)->set_options(labels);
          // Re-assert the current mode's slot now that the option order changed.
          std::string cur = id(clim_hvac_mode).state;
          for (size_t i = 0; i < modes.size(); i++) {
            if (modes[i] == cur || (modes[i] == "auto" && cur == "heat_cool")) {
              id(dd_hvac_mode)->set_selected_index(i, LV_ANIM_OFF);
              break;
            }
          }

  - platform: homeassistant
    id: clim_preset_modes
    entity_id: ${thermostat_entity_id}
    attribute: preset_modes
    on_value:
      - lambda: |-
          // preset_modes are plain strings in HA, so a clean list literal
          // ("['home', 'away']") is expected here — strip the punctuation and
          // split on commas. Logged so the live format can be confirmed.
          std::string raw = x;
          ESP_LOGD("thermostat", "preset_modes raw='%s'", raw.c_str());
          std::vector<std::string> presets, labels;
          std::string tok;
          auto flush = [&]() {
            if (tok.empty()) return;
            std::string label = tok;
            if (label[0] >= 'a' && label[0] <= 'z') label[0] -= 32;  // Title-case
            presets.push_back(tok);
            labels.push_back(label);
            tok.clear();
          };
          for (char c : raw) {
            if (c == '[' || c == ']' || c == '\'' || c == '"' || c == ' ') continue;
            if (c == ',') flush();
            else tok += c;
          }
          flush();
          id(g_preset_modes) = presets;
          if (!presets.empty()) {
            id(dd_preset_mode)->set_options(labels);
            std::string cur = id(clim_preset_mode).state;
            for (size_t i = 0; i < presets.size(); i++) {
              if (presets[i] == cur) {
                id(dd_preset_mode)->set_selected_index(i, LV_ANIM_OFF);
                break;
              }
            }
          }
      # Show the PRESET section only when the entity advertises presets.
      - if:
          condition:
            lambda: 'return id(g_preset_modes).empty();'
          then:
            - lvgl.widget.hide: dd_preset_mode
            - lvgl.widget.hide: lbl_preset_heading
          else:
            - lvgl.widget.show: dd_preset_mode
            - lvgl.widget.show: lbl_preset_heading

script:
  - id: set_hvac_mode
    parameters:
      mode: string
    then:
      - homeassistant.service:
          service: climate.set_hvac_mode
          data:
            entity_id: ${thermostat_entity_id}
            hvac_mode: !lambda return mode;

  - id: set_preset_mode
    parameters:
      preset: string
    then:
      - homeassistant.service:
          service: climate.set_preset_mode
          data:
            entity_id: ${thermostat_entity_id}
            preset_mode: !lambda return preset;

lvgl:
  pages:
    - id: thermostat_page
      widgets:
        - obj:
            width: ${display_width}
            height: ${display_height}
            pad_all: 0
            bg_color: 0x1a1a2e
            border_width: 0
            scrollbar_mode: "off"
            scrollable: false
            widgets:

              # ── Current temperature — large display ───────────────
              - label:
                  id: lbl_current_temp
                  x: 10
                  y: 65
                  width: 460
                  text: "--°"
                  align: TOP_MID
                  text_align: CENTER
                  text_font: montserrat_48
                  text_color: 0xffffff

              - label:
                  x: 10
                  y: 122
                  width: 460
                  text: "CURRENT"
                  align: TOP_MID
                  text_align: CENTER
                  text_font: montserrat_14
                  text_color: 0x888888

              # ── Setpoint row: [-]  22.0°  [+] ─────────────────────
              - obj:
                  x: 10
                  y: 145
                  width: 460
                  height: 70
                  bg_color: 0x1a1a2e
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                  widgets:
                    - button:
                        width: 80
                        height: 60
                        bg_color: 0x0f3460
                        on_press:
                          - lambda: |-
                              float next = id(target_temp) - ${thermostat_temp_step};
                              if (next >= ${thermostat_temp_min}) id(target_temp) = next;
                          - lvgl.label.update:
                              id: lbl_target_temp
                              text: !lambda return str_sprintf("%.1f°", id(target_temp));
                          - homeassistant.service:
                              service: climate.set_temperature
                              data:
                                entity_id: ${thermostat_entity_id}
                                temperature: !lambda return id(target_temp);
                        widgets:
                          - label:
                              text: "-"
                              align: CENTER
                              text_font: montserrat_48
                              text_color: 0xffffff
                    - label:
                        id: lbl_target_temp
                        text: "--°"
                        align: CENTER
                        text_align: CENTER
                        text_font: montserrat_48
                        text_color: 0xe94560
                    - button:
                        width: 80
                        height: 60
                        bg_color: 0x0f3460
                        on_press:
                          - lambda: |-
                              float next = id(target_temp) + ${thermostat_temp_step};
                              if (next <= ${thermostat_temp_max}) id(target_temp) = next;
                          - lvgl.label.update:
                              id: lbl_target_temp
                              text: !lambda return str_sprintf("%.1f°", id(target_temp));
                          - homeassistant.service:
                              service: climate.set_temperature
                              data:
                                entity_id: ${thermostat_entity_id}
                                temperature: !lambda return id(target_temp);
                        widgets:
                          - label:
                              text: "+"
                              align: CENTER
                              text_font: montserrat_48
                              text_color: 0xffffff

              # ── HVAC Mode selection (compact single row) ────────────────
              - label:
                  x: 10
                  y: 220
                  width: 460
                  text: "MODE"
                  text_font: montserrat_14
                  text_color: 0x888888

              # HVAC mode dropdown
              - dropdown:
                  id: dd_hvac_mode
                  x: 10
                  y: 235
                  width: 460
                  height: 45
                  bg_color: 0x0f3460
                  text_color: 0xffffff
                  text_font: montserrat_18
                  options:
                    - "Off"
                    - "Heat"
                    - "Cool"
                    - "Auto"
                    - "Fan Only"
                  selected_index: 0
                  on_value:
                    # Map the selected index back through g_hvac_modes, which
                    # only ever holds modes the entity supports. "auto" is sent
                    # rather than "heat_cool" — the name most HA climate
                    # integrations (Ecobee, Nest, generic thermostat) accept;
                    # devices that canonically report "heat_cool" still accept it.
                    - lambda: |-
                        int idx = x;
                        auto &modes = id(g_hvac_modes);
                        if (idx >= 0 && idx < (int) modes.size()) {
                          id(set_hvac_mode).execute(modes[idx]);
                        }

              # ── PRESET selection (dropdown) ────────────────────
              - label:
                  id: lbl_preset_heading
                  x: 10
                  y: 290
                  width: 460
                  text: "PRESET"
                  text_font: montserrat_14
                  text_color: 0x888888

              # Preset dropdown
              - dropdown:
                  id: dd_preset_mode
                  x: 10
                  y: 308
                  width: 460
                  height: 45
                  bg_color: 0x0f3460
                  text_color: 0xffffff
                  text_font: montserrat_18
                  options:
                    - "Home"
                    - "Away"
                    - "Sleep"
                    - "None"
                  selected_index: 0
                  on_value:
                    - lambda: |-
                        int idx = x;
                        auto &presets = id(g_preset_modes);
                        if (idx >= 0 && idx < (int) presets.size()) {
                          id(set_preset_mode).execute(presets[idx]);
                        }
