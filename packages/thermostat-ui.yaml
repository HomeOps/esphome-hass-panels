# Thermostat UI — LVGL interface wired to Home Assistant climate entity
# Board-independent; include alongside board.yaml and alarm-keypad-ui.yaml.
#
# Layout (480×480 display, nav_bar_height=60):
#   y=  0..59  — navbar (top_layer, handled by nav.yaml)
#   y= 65..120 — current temperature (large)
#   y=122..139 — "CURRENT" sub-label
#   y=145..214 — setpoint row  [-]  XX.X°  [+]
#   y=220..280 — HVAC mode dropdown
#   y=290..350 — preset dropdown
#   Remaining space available for future features

globals:
  - id: target_temp
    type: float
    restore_value: no
    initial_value: '22.0'

sensor:
  - platform: homeassistant
    id: clim_current_temp
    entity_id: ${thermostat_entity_id}
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_current_temp
          text: !lambda return str_sprintf("%.1f°", x);
      - lambda: |-
          std::string preset = id(clim_preset_mode).state;
          if (preset.empty()) preset = "--";
          char buf[64];
          snprintf(buf, sizeof(buf), "%s - %.1f C", preset.c_str(), x);
          if (strcmp("${nav_home_page}", "thermostat_page") == 0) id(g_nav_status_0) = buf;
          if (strcmp("${nav_page_1}", "thermostat_page") == 0) id(g_nav_status_1) = buf;
          if (strcmp("${nav_page_2}", "thermostat_page") == 0) id(g_nav_status_2) = buf;
          if (strcmp("${nav_page_3}", "thermostat_page") == 0) id(g_nav_status_3) = buf;
      - script.execute: nav_refresh_status

  - platform: homeassistant
    id: clim_target_temp_sensor
    entity_id: ${thermostat_entity_id}
    attribute: temperature
    on_value:
      - lambda: id(target_temp) = x;
      - lvgl.label.update:
          id: lbl_target_temp
          text: !lambda return str_sprintf("%.1f°", x);

text_sensor:
  - platform: homeassistant
    id: clim_hvac_mode
    entity_id: ${thermostat_entity_id}
    on_value: []

  - platform: homeassistant
    id: clim_preset_mode
    entity_id: ${thermostat_entity_id}
    attribute: preset_mode
    on_value:
      - lambda: |-
          char buf[64];
          snprintf(buf, sizeof(buf), "%s - %.1f C", x.c_str(), id(clim_current_temp).state);
          if (strcmp("${nav_home_page}", "thermostat_page") == 0) id(g_nav_status_0) = buf;
          if (strcmp("${nav_page_1}", "thermostat_page") == 0) id(g_nav_status_1) = buf;
          if (strcmp("${nav_page_2}", "thermostat_page") == 0) id(g_nav_status_2) = buf;
          if (strcmp("${nav_page_3}", "thermostat_page") == 0) id(g_nav_status_3) = buf;
      - script.execute: nav_refresh_status

script:
  - id: set_hvac_mode
    parameters:
      mode: string
    then:
      - homeassistant.service:
          service: climate.set_hvac_mode
          data:
            entity_id: ${thermostat_entity_id}
            hvac_mode: !lambda return mode;

  - id: set_preset_mode
    parameters:
      preset: string
    then:
      - homeassistant.service:
          service: climate.set_preset_mode
          data:
            entity_id: ${thermostat_entity_id}
            preset_mode: !lambda return preset;

lvgl:
  pages:
    - id: thermostat_page
      widgets:
        - obj:
            width: ${display_width}
            height: ${display_height}
            pad_all: 0
            bg_color: 0x1a1a2e
            border_width: 0
            scrollbar_mode: "off"
            scrollable: false
            widgets:

              # ── Current temperature — large display ───────────────
              - label:
                  id: lbl_current_temp
                  x: 10
                  y: 65
                  width: 460
                  text: "--°"
                  align: TOP_MID
                  text_align: CENTER
                  text_font: montserrat_48
                  text_color: 0xffffff

              - label:
                  x: 10
                  y: 122
                  width: 460
                  text: "CURRENT"
                  align: TOP_MID
                  text_align: CENTER
                  text_font: montserrat_14
                  text_color: 0x888888

              # ── Setpoint row: [-]  22.0°  [+] ─────────────────────
              - obj:
                  x: 10
                  y: 145
                  width: 460
                  height: 70
                  bg_color: 0x1a1a2e
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                  widgets:
                    - button:
                        width: 80
                        height: 60
                        bg_color: 0x0f3460
                        on_press:
                          - lambda: |-
                              float next = id(target_temp) - ${thermostat_temp_step};
                              if (next >= ${thermostat_temp_min}) id(target_temp) = next;
                          - lvgl.label.update:
                              id: lbl_target_temp
                              text: !lambda return str_sprintf("%.1f°", id(target_temp));
                          - homeassistant.service:
                              service: climate.set_temperature
                              data:
                                entity_id: ${thermostat_entity_id}
                                temperature: !lambda return id(target_temp);
                        widgets:
                          - label:
                              text: "-"
                              align: CENTER
                              text_font: montserrat_48
                              text_color: 0xffffff
                    - label:
                        id: lbl_target_temp
                        text: "--°"
                        align: CENTER
                        text_align: CENTER
                        text_font: montserrat_48
                        text_color: 0xe94560
                    - button:
                        width: 80
                        height: 60
                        bg_color: 0x0f3460
                        on_press:
                          - lambda: |-
                              float next = id(target_temp) + ${thermostat_temp_step};
                              if (next <= ${thermostat_temp_max}) id(target_temp) = next;
                          - lvgl.label.update:
                              id: lbl_target_temp
                              text: !lambda return str_sprintf("%.1f°", id(target_temp));
                          - homeassistant.service:
                              service: climate.set_temperature
                              data:
                                entity_id: ${thermostat_entity_id}
                                temperature: !lambda return id(target_temp);
                        widgets:
                          - label:
                              text: "+"
                              align: CENTER
                              text_font: montserrat_48
                              text_color: 0xffffff

              # ── HVAC Mode selection (dropdown-style) ────────────────
              - label:
                  x: 10
                  y: 220
                  width: 460
                  text: "MODE"
                  text_font: montserrat_14
                  text_color: 0x888888

              # Mode buttons in single row (compact)
              - obj:
                  x: 10
                  y: 241
                  width: 460
                  height: 40
                  bg_color: 0x1a1a2e
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_AROUND
                    flex_align_cross: STRETCH
                  widgets:
                    - button:
                        width: 70
                        height: 40
                        bg_color: 0x16213e
                        on_press:
                          - homeassistant.service:
                              service: climate.set_hvac_mode
                              data: {entity_id: "${thermostat_entity_id}", hvac_mode: "off"}
                        widgets:
                          - label: {text: "OFF", align: CENTER, text_font: montserrat_20, text_color: 0xffffff}
                    - button:
                        width: 70
                        height: 40
                        bg_color: 0x16213e
                        on_press:
                          - homeassistant.service:
                              service: climate.set_hvac_mode
                              data: {entity_id: "${thermostat_entity_id}", hvac_mode: "heat"}
                        widgets:
                          - label: {text: "HEAT", align: CENTER, text_font: montserrat_18, text_color: 0xffffff}
                    - button:
                        width: 70
                        height: 40
                        bg_color: 0x16213e
                        on_press:
                          - homeassistant.service:
                              service: climate.set_hvac_mode
                              data: {entity_id: "${thermostat_entity_id}", hvac_mode: "cool"}
                        widgets:
                          - label: {text: "COOL", align: CENTER, text_font: montserrat_18, text_color: 0xffffff}
                    - button:
                        width: 70
                        height: 40
                        bg_color: 0x16213e
                        on_press:
                          - homeassistant.service:
                              service: climate.set_hvac_mode
                              data: {entity_id: "${thermostat_entity_id}", hvac_mode: "heat_cool"}
                        widgets:
                          - label: {text: "AUTO", align: CENTER, text_font: montserrat_18, text_color: 0xffffff}
                    - button:
                        width: 70
                        height: 40
                        bg_color: 0x16213e
                        on_press:
                          - homeassistant.service:
                              service: climate.set_hvac_mode
                              data: {entity_id: "${thermostat_entity_id}", hvac_mode: "fan_only"}
                        widgets:
                          - label: {text: "FAN", align: CENTER, text_font: montserrat_18, text_color: 0xffffff}

              # ── PRESET selection (compact grid) ────────────────────
              - label:
                  x: 10
                  y: 290
                  width: 460
                  text: "PRESET"
                  text_font: montserrat_14
                  text_color: 0x888888

              # Preset buttons in single row
              - obj:
                  x: 10
                  y: 311
                  width: 460
                  height: 40
                  bg_color: 0x1a1a2e
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_AROUND
                    flex_align_cross: STRETCH
                  widgets:
                    - button:
                        width: 74
                        height: 40
                        bg_color: 0x16213e
                        on_press:
                          - homeassistant.service:
                              service: climate.set_preset_mode
                              data: {entity_id: "${thermostat_entity_id}", preset_mode: "home"}
                        widgets:
                          - label: {text: "HOME", align: CENTER, text_font: montserrat_18, text_color: 0xffffff}
                    - button:
                        width: 74
                        height: 40
                        bg_color: 0x16213e
                        on_press:
                          - homeassistant.service:
                              service: climate.set_preset_mode
                              data: {entity_id: "${thermostat_entity_id}", preset_mode: "away"}
                        widgets:
                          - label: {text: "AWAY", align: CENTER, text_font: montserrat_18, text_color: 0xffffff}
                    - button:
                        width: 74
                        height: 40
                        bg_color: 0x16213e
                        on_press:
                          - homeassistant.service:
                              service: climate.set_preset_mode
                              data: {entity_id: "${thermostat_entity_id}", preset_mode: "sleep"}
                        widgets:
                          - label: {text: "SLEEP", align: CENTER, text_font: montserrat_16, text_color: 0xffffff}
                    - button:
                        width: 74
                        height: 40
                        bg_color: 0x16213e
                        on_press:
                          - homeassistant.service:
                              service: climate.set_preset_mode
                              data: {entity_id: "${thermostat_entity_id}", preset_mode: "eco"}
                        widgets:
                          - label: {text: "ECO", align: CENTER, text_font: montserrat_18, text_color: 0xffffff}
                    - button:
                        width: 74
                        height: 40
                        bg_color: 0x16213e
                        on_press:
                          - homeassistant.service:
                              service: climate.set_preset_mode
                              data: {entity_id: "${thermostat_entity_id}", preset_mode: "boost"}
                        widgets:
                          - label: {text: "BOOST", align: CENTER, text_font: montserrat_14, text_color: 0xffffff}
