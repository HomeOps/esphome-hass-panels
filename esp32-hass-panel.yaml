# ESP32 Home Panel — full bundle: every UI page wired into the swipe cycle.
#
# Batteries-included entry point — all five pages are compiled. For a smaller
# image that omits unused pages, compose packages/core.yaml with only the UI
# packages you want instead of this file (see packages/core.yaml + README).
#
# Board: Guition ESP32-S3-4848S040
# Sources:
#   Pin map + display config: https://devices.esphome.io/devices/guition-esp32-s3-4848s040/
#   Full community config:    https://github.com/esphome/esphome-devices/blob/main/src/docs/devices/Guition-ESP32-S3-4848S040/index.md
#   Board overview:           https://homeding.github.io/boards/esp32s3/panel-4848S040.htm

substitutions:
  # Full-bundle swipe cycle: alarm · thermostat · cover. The energy and area
  # pages are compiled too — register one in a slot (and bump nav_page_count)
  # to expose it. All board / entity defaults come from packages/core.yaml
  # and the individual UI packages; override any of them here or per device.
  nav_page_1: alarm_page
  nav_page_2: thermostat_page
  nav_page_3: cover_page
  nav_page_count: "3"
  # nav_home_page defaults to "1" in packages/nav.yaml — override here if a
  # different declared page should be the landing / auto-return target.

packages:
  core: !include packages/core.yaml
  alarm_ui: !include packages/alarm-keypad-ui.yaml
  thermostat_ui: !include packages/thermostat-ui.yaml
  cover_ui: !include packages/cover-ui.yaml
  energy_ui: !include packages/energy-ui.yaml
  area_ui: !include packages/area-ui.yaml
