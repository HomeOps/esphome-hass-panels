# CI fixture — bedroom alarm panel (slim composition).
#
# Slim per-device config: core scaffolding + ONLY the alarm UI (no
# thermostat, cover, energy or area pages compiled), sleep mode enabled by
# default with a 60s auto-off timeout. Mirrors a real bedroom-mounted panel.
#
# nav_page_1 defaults to alarm_page (nav.yaml), so only nav_page_count is set.
# All board hardware + connectivity come from packages/core.yaml; the alarm
# entity defaults from packages/alarm-keypad-ui.yaml.
#
# Compile-only — never flashed to a real device.

substitutions:
  name: test-bedroom-alarm-panel
  friendly_name: Test Bedroom Alarm Panel
  nav_page_count: "1"
  sleep_mode_default_state: "ON"
  sleep_mode_default_timeout: "60"

packages:
  core: !include ../packages/core.yaml
  alarm_ui: !include ../packages/alarm-keypad-ui.yaml
