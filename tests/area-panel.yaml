# CI fixture — single-page Area panel.
#
# Slim per-device config: one swipeable page (the area group dashboard —
# no alarm, thermostat or garage). Registers area_page in nav slot 1 so CI
# actually wires the strcmp("${nav_page_N}", "area_page") routing in
# area-ui.yaml — without a registered slot the page compiles but every
# strcmp resolves false at YAML-merge time and the navbar routing is dead.
#
# All board hardware substitutions come from packages/board.yaml's
# defaults; the area_* entity ids default from packages/area-ui.yaml.
#
# Compile-only — never flashed to a real device.

substitutions:
  name: test-area-panel
  friendly_name: Test Area Panel
  # Configure every optional kind (incl. locks) so CI exercises each card's
  # subscription, the boot visibility pass, and the lock toggle branch —
  # not just the mandatory lights card.
  area_name: Test Area
  area_lights_entity_id: light.test_area
  area_switches_entity_id: switch.test_area
  area_covers_entity_id: cover.test_area
  area_locks_entity_id: lock.test_area
  area_temp_entity_id: sensor.test_area_temperature
  area_humidity_entity_id: sensor.test_area_humidity
  nav_page_1: area_page
  # Unused slots must point at a page that exists in THIS config. nav.yaml's
  # nav_show_page references nav_page_2..4, whose defaults (alarm_page) aren't
  # compiled here — point them all at area_page so every slot resolves.
  nav_page_2: area_page
  nav_page_3: area_page
  nav_page_4: area_page
  nav_page_count: "1"

packages:
  board: !include ../packages/board.yaml
  area_ui: !include ../packages/area-ui.yaml
  nav: !include ../packages/nav.yaml
  # board.yaml's touch handler references sleep-mode globals/scripts
  # (g_swallow_touch, sleep_mode_wake, …), so this package is required.
  sleep_mode: !include ../packages/sleep-mode.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: "HomeOps.esphome-hass-panels"
    version: "2.1.1" # x-release-please-version

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

# No encryption — test secrets fixture has no api_encryption_key.
api:

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password

captive_portal:

lvgl:
  rotation: ${display_rotation}
