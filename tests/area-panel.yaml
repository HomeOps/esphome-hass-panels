# CI fixture — single-page Area panel (slim composition).
#
# Demonstrates the slim build model: core scaffolding + ONLY the area UI, so
# none of the other pages are compiled. Registers area_page in nav slot 1 so
# CI exercises the strcmp("${nav_page_N}", "area_page") routing in
# area-ui.yaml, and configures every kind so each card / lambda / the popup
# is code-generated and type-checked.
#
# Compile-only — never flashed to a real device.

substitutions:
  name: test-area-panel
  friendly_name: Test Area Panel
  # Configure every optional kind (incl. locks) so CI exercises each card's
  # subscription, the boot visibility pass, the lock toggle branch, and the
  # brightness/colour popup.
  area_name: Test Area
  area_lights_entity_id: light.test_area
  area_switches_entity_id: switch.test_area
  area_covers_entity_id: cover.test_area
  area_locks_entity_id: lock.test_area
  area_temp_entity_id: sensor.test_area_temperature
  area_humidity_entity_id: sensor.test_area_humidity
  # area_page in slot 1; unused slots must also resolve to a compiled page,
  # so point them at area_page too (their alarm_page default isn't built here).
  nav_page_1: area_page
  nav_page_2: area_page
  nav_page_3: area_page
  nav_page_4: area_page
  nav_page_count: "1"

packages:
  core: !include ../packages/core.yaml
  area_ui: !include ../packages/area-ui.yaml
